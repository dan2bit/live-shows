<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{COUNT}} signatures on Dan's red concert hat, {{LATEST_NAME}} most recent, {{FIRST_DATE}} to {{LATEST_DATE}}.">
<link rel="icon" type="image/png" sizes="32x32" href="../static/favicon.png">
<style>
  /*
    Palette copied from styles.css's :root (not linked live) so this page
    stays standalone and shareable without the SPA's ~30KB of unrelated
    rules (#412, open decision 2b). If the main site's palette changes,
    resync the values below by hand.
  */
  :root{
    --bg:#0f0f0f;
    --surface:#1a1a1a;
    --border:#2e2e2e;
    --border-bright:#3a3a3a;
    --text:#e8e4dc;
    --text-muted:#9a928a;
    --text-dim:#8e8a7a;
    --hat:#d08040;
    --hat-dim:#3a2010;
    --hat-bg:#1a0e08;
    --mono:'IBM Plex Mono',monospace;
    --sans:'IBM Plex Sans',sans-serif;
    --print-content-width:{{PRINT_CONTENT_WIDTH_IN}}in;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    font-size:15px;
    line-height:1.5;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .page{max-width:640px;margin:0 auto;padding:0 20px 48px;}

  .masthead{padding-top:20px;}
  .banner{display:block;width:100%;max-width:420px;margin:0 auto 18px;}
  h1{
    font-family:var(--mono);
    font-weight:700;
    font-size:22px;
    letter-spacing:.01em;
    color:var(--hat);
    text-align:center;
  }
  .tagline{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-muted);
    text-align:center;
    margin-top:4px;
  }
  .stat-line{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-dim);
    text-align:center;
    margin-top:10px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .stat-line strong{color:var(--hat);font-weight:500;}

  .entries{margin-top:8px;}
  .year-group + .year-group{margin-top:22px;}
  .year{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.06em;
    color:var(--text-dim);
    padding-bottom:6px;
    margin-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .entry-list{list-style:none;}
  .entry{padding:7px 0;}
  .entry + .entry{border-top:1px solid var(--border);}
  .signer{font-size:15px;color:var(--text);}
  .attribution{font-size:13px;color:var(--text-muted);font-style:italic;}
  .meta{
    display:block;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
    margin-top:1px;
  }

  .page-footer{
    margin-top:28px;
    padding-top:18px;
    border-top:1px solid var(--border);
    text-align:center;
  }
  .listen-link{
    font-family:var(--mono);
    font-size:13px;
    color:var(--hat);
    text-decoration:none;
    border-bottom:1px solid var(--hat-dim);
  }
  .listen-link:hover{border-bottom-color:var(--hat);}

  .print-only{display:none;}

  @media print{
    @page{size:{{PRINT_PAGE_SIZE}} portrait;margin:0.25in;}
    html,body{background:#faf6ee;color:#1a1410;font-size:8pt;line-height:1.2;}
    *{
      print-color-adjust:exact;
      -webkit-print-color-adjust:exact;
      color-adjust:exact;
    }
    :root{
      --border:#d8cfc0;
      --text:#1a1410;
      --text-muted:#55493c;
      --text-dim:#6b5f50;
      --hat:#a5321c;
      --hat-dim:#c8b8a0;
    }
    .page{
      max-width:none;
      width:var(--print-content-width);
      margin:0;
      padding:0;
    }
    .masthead{padding-top:0;}
    .banner{max-width:46%;margin-bottom:5pt;}
    h1{font-size:12pt;}
    .tagline{font-size:7.5pt;}
    .stat-line{font-size:7.5pt;padding-bottom:4pt;margin-top:3pt;}

    /* One line per entry, no divider, no year label - the whole point of
       this pass (2026-09-29) is fitting all 54 rows on a single sheet.
       Screen mode is untouched: it keeps the multi-line list with
       dividers and year headers, which is fine when nobody is fitting it
       on paper. Column count is set by the generator (PRINT_COLUMN_COUNT)
       after actually measuring whether one column fits - not guessed here. */
    .entries{column-count:{{PRINT_COLUMN_COUNT}};column-gap:16pt;}
    .year-group{margin-top:2pt;}
    .year-group:first-child{margin-top:0;}
    .year{display:none;}
    .entry-list{list-style:none;}
    .entry{
      padding:0;
      line-height:1.12;
      break-inside:avoid;
      page-break-inside:avoid;
    }
    .entry + .entry{border-top:none;}  /* screen's divider rule, explicitly off for print */
    .signer,.attribution,.meta{display:inline;font-size:8pt;}
    .attribution{margin-left:2pt;}
    .meta{
      font-family:var(--mono);
      color:var(--text-dim);
      margin-top:0;
    }
    .meta::before{content:" \2014 ";color:var(--text-dim);}  /* em dash: the only separator once venue/date share the name's line */

    .listen-link{color:#a5321c;font-size:7.5pt;}
    .print-only{display:block;}
    .page-footer{margin-top:4pt;padding-top:3pt;break-inside:avoid;display:flex;align-items:center;gap:7pt;justify-content:center;}
    .qr-block{
      margin-top:0;
      display:flex;
      align-items:center;
      gap:6pt;
      justify-content:center;
    }
    .qr{width:0.5in;height:0.5in;flex:none;}
    .qr-caption{font-family:var(--mono);font-size:6pt;color:var(--text-dim);text-align:left;}
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <img class="banner" src="../{{BANNER_SVG}}" alt="Dan's red hat">
    <h1>{{TITLE}}</h1>
    <p class="tagline">{{TAGLINE}}</p>
    <p class="stat-line"><strong>{{COUNT}}</strong> signers &middot; latest: {{LATEST_NAME}}, {{LATEST_DATE}}</p>
  </header>

  <main class="entries">
{{ENTRIES}}
  </main>

  <footer class="page-footer">
    <a class="listen-link" href="{{PLAYLIST_URL}}">Listen to the playlist</a>
    <div class="qr-block print-only">
      <img class="qr" src="../{{PLAYLIST_QR}}" alt="QR code for the playlist">
      <span class="qr-caption">{{PLAYLIST_URL_SHORT}}</span>
    </div>
  </footer>
</div>
</body>
</html>
