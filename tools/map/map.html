<script src="../../artist-modal.js"></script>
<style>
  :root{
    --paper:#EDE0C2; --ink:#221A12; --gold:#C9962E;
    --coast:#2E4A6B; --range:#8a5a2a; --foothills:#7a6db0; --heart:#8A6A1F;
    --port:#A63D2F; --woods:#3d6b45; --isles:#5b8bb0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:#14100E;overflow:hidden;font-family:'Oswald',sans-serif;}
  #stage{position:absolute;inset:0;cursor:grab;}
  #stage.panning{cursor:grabbing;}
  #map{display:block;width:100%;height:100%;}

  /* regions: soft hulls and ghost labels */
  .region-hull{fill:var(--tint);fill-opacity:.05;stroke:var(--tint);stroke-opacity:.5;
    stroke-width:.8;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none;}
  .region-label{font-family:'Special Elite',monospace;fill:var(--tint);
    text-anchor:middle;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;
    paint-order:stroke;stroke:rgba(237,224,194,.8);stroke-width:3px;}

  .stl{cursor:pointer;pointer-events:bounding-box;}
  .stl circle{pointer-events:all;}
  .stl circle{stroke:var(--ink);vector-effect:non-scaling-stroke;}
  .stl .dot{fill:var(--tint,#4a3a26);}
  .stl.capital .ring{fill:none;stroke-width:1.2;}
  .stl.unvisited .dot{fill:rgba(237,224,194,.9);stroke:var(--tint);stroke-width:1.3;stroke-dasharray:1.6 1.4;}
  .stl.faded .dot{fill-opacity:.35;}
  .stl.legacy .dot{fill:var(--gold);}
  .stl .tick{stroke:var(--ink);stroke-width:.5;fill:var(--tint);}
  .stl.traced .traceno{font-size:5.5px;fill:#0e5a70;paint-order:stroke;stroke:rgba(237,224,194,.9);stroke-width:1.6px;}
  .stl.traced .dot{stroke:#0e5a70;stroke-width:1.6;}
  body.tracing .stl .dot{fill:rgba(237,224,194,.92);stroke:#FF2FA0;stroke-width:1.4;stroke-dasharray:none;opacity:1;}
  body.tracing .stl.tracedone .dot{fill:rgba(34,26,18,.28);stroke:rgba(34,26,18,.45);stroke-width:.8;}
  body.tracing .stl.traced .dot{fill:#0e5a70;stroke:#0e5a70;}
  body.tracing .stl text{opacity:.9;}
  #traceName{width:100%;font-family:'Oswald';font-size:12px;border:1.5px solid var(--ink);background:#f6eed9;padding:4px;margin-top:4px;display:none;}
  .tracepath{fill:none;stroke:#0e5a70;stroke-width:1.2;stroke-dasharray:3 2;opacity:.75;vector-effect:non-scaling-stroke;}
  /* settlement labels: every settlement carries one <text class="lbl"> at one size; zoom decides
     which tiers show. apply() writes data-zoom-tier on the svg from vb.w (1: capitals and cities,
     2: + towns, 3: + villages, 4: + hamlets and waystations) and each .stl carries data-lt, its
     own tier. A label pinned by a click (.pinlabel), a finder hit (.found) or a traced settlement
     (.traced) shows at any zoom. The legend's "names" toggle still hides them all. */
  .stl .lbl{display:none;font-size:7px;}
  #map[data-zoom-tier="1"] .stl[data-lt="1"] .lbl,
  #map[data-zoom-tier="2"] .stl[data-lt="1"] .lbl,#map[data-zoom-tier="2"] .stl[data-lt="2"] .lbl,
  #map[data-zoom-tier="3"] .stl[data-lt="1"] .lbl,#map[data-zoom-tier="3"] .stl[data-lt="2"] .lbl,#map[data-zoom-tier="3"] .stl[data-lt="3"] .lbl,
  #map[data-zoom-tier="4"] .stl .lbl,
  .stl.pinlabel .lbl,.stl.found .lbl,.stl.traced .lbl{display:block;}
  .geo-island{font-family:'Special Elite',monospace;fill:#EDE0C2;letter-spacing:.1em;paint-order:stroke;stroke:rgba(34,26,18,.85);stroke-width:2.2px;}
  .geo-water{fill:#d9e6f0;font-style:italic;letter-spacing:.06em;paint-order:stroke;stroke:rgba(20,35,55,.9);stroke-width:2px;}
  /* a water named in labels.json -> water_tiers follows the settlement label tiers above: a
     city-tier river shows at any zoom, a town-tier one from 2x, village from 4x, hamlet from 8x.
     A water with no tier (the lakes) always shows. */
  .geo-water[data-lt]{display:none;}
  #map[data-zoom-tier="1"] .geo-water[data-lt="1"],
  #map[data-zoom-tier="2"] .geo-water[data-lt="1"],#map[data-zoom-tier="2"] .geo-water[data-lt="2"],
  #map[data-zoom-tier="3"] .geo-water[data-lt="1"],#map[data-zoom-tier="3"] .geo-water[data-lt="2"],#map[data-zoom-tier="3"] .geo-water[data-lt="3"],
  #map[data-zoom-tier="4"] .geo-water[data-lt]{display:block;}
  #rose{opacity:.94;}
  #rose-home{pointer-events:all;cursor:pointer;}
  #rose-home:hover #rose-clef,#rose-home:focus-visible #rose-clef{stroke:#0e5a70;}
  #rose-home:hover circle,#rose-home:focus-visible circle{opacity:.85;}
  .region-label,.geo-island,.geo-water{pointer-events:none;}
  body.editing .region-label,body.editing .geo-island,body.editing .geo-water{pointer-events:all;cursor:move;}
  /* placement halos are the editor's worklist: drawn only while editing, one ring per kind.
     unplaced = staged, position meaningless (solid pink dash); unpinned = builder-positioned,
     no pin, can move on a rebuild (faint dotted); stray = pinned outside its region polygon,
     advisory, behind its own toggle (amber dash). */
  .stl .halo{display:none;fill:none;vector-effect:non-scaling-stroke;}
  body.editing .stl.unplaced .halo{display:block;stroke:#FF2FA0;stroke-width:1.7;stroke-dasharray:3 1.6;}
  body.editing .stl.unpinned .halo{display:block;stroke:#FF2FA0;stroke-width:1;stroke-dasharray:1 2;opacity:.6;}
  body.editing.strays .stl.stray .halo{display:block;stroke:#C9962E;stroke-width:1.4;stroke-dasharray:4 2;}
  .stl.ruin .dot{fill:none;stroke:#7a5a33;stroke-width:1.5;stroke-dasharray:4.5 3.5;}
  .stl.ruin text{opacity:.7;font-style:italic;}
  /* Paper-white on the tinted dot. Strokes are non-scaling so the glyph keeps its
     weight as the dot grows with zoom; the geometry scales, the ink does not. */
  .stl .hm-anchor{color:var(--paper);pointer-events:none;}
  .stl .hm-anchor *{vector-effect:non-scaling-stroke;}
  /* An unvisited dot is paper-filled, so a paper glyph would vanish into it. No
     current harbormistress is unvisited (the flag implies a visit), but the map
     data is editable, so this is a guard rather than dead style. */
  .stl.unvisited .hm-anchor{color:var(--tint);}
  .stl.found .foundring{fill:none;stroke:#FFDD35;stroke-width:2.2;vector-effect:non-scaling-stroke;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{stroke-opacity:1;}50%{stroke-opacity:.25;}}
  #finder{width:100%;font-family:'Oswald';font-size:13px;background:#f6eed9;border:1.5px solid var(--ink);padding:5px 7px;margin-top:9px;}
  #findmsg{font-family:'Special Elite',monospace;font-size:10.5px;margin-top:3px;min-height:13px;}
  .stl text{font-family:'Oswald';font-weight:500;fill:var(--ink);
    paint-order:stroke;stroke:rgba(237,224,194,.85);stroke-width:2.4px;pointer-events:none;}
  /* A visible settlement name is the link to its card - the same rule the poster and the
     list pages use, so the map does not invent a third convention. The DOT keeps toggling
     the label, so an unlabelled hamlet is still "click to ask its name, click the name to
     ask about it". View mode only: edit and trace keep pointer-events:none here so drag
     and trace targets are exactly what they were. */
  body:not(.editing):not(.tracing) .stl text.lbl{pointer-events:auto;cursor:pointer;}
  body:not(.editing):not(.tracing) .stl text.lbl:hover{text-decoration:underline;}
  #readout .name.am-open{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
  .stl:hover .dot{stroke-width:1.6;}

  #plate{
    position:absolute;left:18px;top:50%;transform:translateY(-50%);width:262px;
    background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 55%),var(--paper);
    border:2px solid var(--ink);outline:1px solid var(--paper);outline-offset:-6px;
    padding:0 16px 12px;box-shadow:0 8px 28px rgba(0,0,0,.55);color:var(--ink);
    touch-action:none;
  }
  #plate h1{
    font-family:'Special Elite',monospace;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;border-bottom:2px solid var(--ink);
    padding:13px 0 7px;cursor:move;user-select:none;
    display:flex;align-items:baseline;gap:8px;justify-content:space-between;
  }
  #plate h1 .shaded-name{
    font-size:11px;letter-spacing:.04em;text-transform:none;opacity:.75;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none;
  }
  /* Windowshade: collapsed hides every child but the grip bar. The grip's own hovered-name
     span is the exception (shows only while collapsed) so the one thing the plate is open
     for mid-edit - what you're hovering - survives the collapse that was hiding it. */
  #plate.shaded > :not(#plateGrip){display:none;}
  /* Collapsed, the bar is the settlement's name and nothing else: the title gives up its
     width (the page is already identified by the rose and the footer), and the name is the
     link to the card - the one thing a collapsed plate is for, on a phone especially. */
  #plate.shaded #plateGrip > span:first-child{display:none;}
  #plate.shaded #plateGrip .shaded-name{display:inline;flex:1;min-width:0;font-size:14px;letter-spacing:0;opacity:1;cursor:pointer;}
  #plate.shaded #plateGrip .shaded-name:not(:empty):hover{text-decoration:underline dotted;text-underline-offset:3px;}
  #plate.shaded #plateGrip .shaded-name:empty::before{content:'\2014';opacity:.45;}
  #plate.shaded{padding-bottom:0;}
  #shadeBtn{
    font-family:'Special Elite',monospace;font-size:13px;line-height:1;background:none;border:none;
    color:var(--ink);cursor:pointer;padding:2px 4px;flex:none;
  }
  #readout{min-height:74px;padding:9px 0 7px;border-bottom:1px solid rgba(34,26,18,.35);}
  #readout .name{font-size:18px;font-weight:600;line-height:1.15;}
  #readout .where{font-family:'Special Elite',monospace;font-size:11.5px;letter-spacing:.06em;margin-top:2px;}
  #readout .stats{font-size:12.5px;margin-top:5px;line-height:1.5;}
  #readout.idle .name{opacity:.55;font-weight:400;font-size:14px;}
  #legend{padding-top:8px;font-size:12px;line-height:1.95;}
  #legend label{display:inline-flex;align-items:center;gap:5px;margin-right:9px;cursor:pointer;}
  /* View toggles: two rows (features / settlements), two boxes each. A fixed-width key keeps
     the boxes in columns; at the plate's normal widths each row fits on one line, so the block
     is no taller than the old five-box run. Only a plate narrower than a 360px phone's
     wraps a row onto a third line, as the old layout already did there. */
  #legend .lgrow{display:flex;align-items:center;flex-wrap:wrap;}
  #legend .lgk{flex:0 0 68px;font-family:'Special Elite',monospace;font-size:10px;letter-spacing:.02em;opacity:.8;}
  #legend .lgrow label{margin-right:7px;}
  #legend .lgrow label:last-child{margin-right:0;}
  #legend input{accent-color:var(--ink);}

  #zoomer{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;}
  /* Coarse-pointer devices (phones, tablets): the plate sits top-left where the eye lands and
     starts collapsed, the stage owns every touch so pinch and drag reach the map instead of
     the page's own zoom, and the step buttons give way to pinch - only the fit button stays.
     Edit and trace are never offered here; they are a desktop job. */
  body.device #plate{left:8px;top:8px;transform:none;width:min(262px,70vw);}
  body.device #stage{touch-action:none;}
  body.device #zoomer #zin,body.device #zoomer #zout{display:none;}
  body.device #ownerControls{display:none !important;}
  /* The portrait nudge: the map is a landscape thing, and letterboxed across a portrait
     screen it reads as broken. One line, shown only on a device held upright; the button
     beside it appears only where the browser can actually rotate the display. */
  #rotateHint{display:none;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:92vw;
    background:rgba(34,26,18,.88);color:var(--paper);font-family:'Special Elite',monospace;font-size:12px;
    letter-spacing:.04em;padding:6px 12px;border:1px solid var(--paper);align-items:center;gap:10px;white-space:nowrap;z-index:8;}
  body.device.portrait #rotateHint{display:flex;}
  #rotateHint button{font-family:'Special Elite',monospace;font-size:12px;border:1px solid var(--paper);background:var(--paper);color:var(--ink);padding:3px 8px;cursor:pointer;}
  #zoomer button{
    width:34px;height:34px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    font-family:'Special Elite',monospace;font-size:16px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4);
  }
  #zoomer button:hover{background:#f5ecd6;}
  #err{position:absolute;top:16px;left:16px;right:64px;color:var(--paper);
    font-family:'Special Elite',monospace;font-size:14px;line-height:1.7;display:none;}
  /* #406 routes layer: one hairline weight for every class, pattern per class -
     dots for trails and passes, dashes for ferries, solid for roads and the autobahn (a hair
     heavier). Roads, passes and trails take their region's tint (a cross-region hop switches
     where it enters the destination's hull); ferries stay in ink, the autobahn in the Range
     tint. The layer sits at .9 so rivers and lakes stay the primary features under it. */
  #routes{opacity:.9;}
  #routes .core{stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;}
  #routes .core.autobahn{stroke-width:1.5;}
  #routes .core.trail,#routes .core.pass{stroke-dasharray:0.1 3.2;}
  #routes .core.ferry{stroke-dasharray:5 3.5;}
  /* bridges (drawn where a road, pass or trail crosses painted water): ink parapet rails
     for roads and the autobahn, a paper-filled stone arch for passes, a plank or stepping
     stones for trails. Map-unit sizes, so they scale with the zoom like the routes do. */
  #routes .bridge{pointer-events:none;}
  #routes .bridge .b-rail{fill:none;stroke:var(--ink);stroke-width:.32;stroke-linecap:round;stroke-linejoin:round;}
  #routes .bridge .b-plank{fill:var(--paper);stroke:var(--ink);stroke-width:.25;}
  #routes .bridge .b-arch{fill:none;stroke:var(--ink);stroke-width:.4;stroke-linecap:round;}
  #routes .bridge .b-arch-fill{fill:var(--paper);opacity:.9;}
  #routes .bridge .b-stone{fill:#b9ad90;stroke:var(--ink);stroke-width:.2;}
  /* route editor: a wide invisible hit stroke per hop, live only in edit mode; the
     selected route reads heavier; yellow handles are the hand waypoints (drag; alt-click
     removes), the small white ones in the gaps insert a waypoint where clicked */
  #routes .hit{stroke-width:9;pointer-events:none;}
  body.editing #routes .hit{pointer-events:stroke;cursor:pointer;}
  body.editing #routes .route.sel .core{stroke-width:2;}
  #routeEdit .vh{fill:#FFDD35;stroke:var(--ink);stroke-width:.7;cursor:grab;vector-effect:non-scaling-stroke;}
  #routeEdit .vh.add{fill:#fff;opacity:.85;cursor:copy;}
  .save-ind{font-family:'Special Elite',monospace;}
  .save-ind.ok{color:#2e6b3d;}
  .save-ind.err{color:#a63d2f;}
  #plateFoot{
    margin-top:9px;padding-top:7px;border-top:1px solid rgba(34,26,18,.35);
    font-family:'Special Elite',monospace;font-size:11.5px;letter-spacing:.1em;
    text-transform:uppercase;text-align:center;opacity:.8;
  }
  #rosterBanner{transition:none;}
  #rosterBanner.shaded{padding-bottom:7px;}
  #rosterBanner.shaded>:not(.rb-head){display:none;}
  .rb-head{display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .rb-head>b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #rosterBanner .rb-name{all:unset;cursor:pointer;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #rosterBanner .rb-name:hover{text-decoration:underline;}
  #rosterBanner .rb-prov{display:block;font-size:10px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #rosterBanner .rb-links{font-size:9.5px;display:flex;gap:4px;opacity:.85;flex:none;}
  #rosterBanner .rb-links a{color:#EDE0C2;text-decoration:underline dotted;}
  #rbShadeBtn{
    font-family:'Special Elite',monospace;font-size:13px;line-height:1;background:none;border:none;
    color:#EDE0C2;cursor:pointer;padding:0 2px;flex:none;
  }
</style>
</head>
<body>
<div id="stage"><svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"><defs>
  <!-- Harbormistress anchor. Hand-drawn rather than an icon-set path: at a 3-4 unit
       radius an imported anchor turns to mud, and four stroked elements survive.
       Stroke is currentColor so the same symbol serves the paper-white glyph on a
       tinted dot and the ink-coloured swatch in the legend.
       Nothing here is a closed loop except the shackle - that is what keeps the
       silhouette reading as an anchor and not a flower at small sizes. -->
  <symbol id="hm-anchor" viewBox="-5 -5 10 10">
    <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
      <circle cx="0" cy="-3.6" r="1.1" stroke-width="0.8"/>
      <line x1="0" y1="-2.5" x2="0" y2="2.6"/>
      <line x1="-1.5" y1="-1.6" x2="1.5" y2="-1.6" stroke-width="0.85"/>
      <path d="M0 2.6 C -2.6 2.6 -3.4 0.8 -3.2 -0.4"/>
      <path d="M-3.2 -0.4 L-2.1 0.1 M-3.2 -0.4 L-3.9 0.5" stroke-width="0.8"/>
      <path d="M0 2.6 C 2.6 2.6 3.4 0.8 3.2 -0.4"/>
      <path d="M3.2 -0.4 L2.1 0.1 M3.2 -0.4 L3.9 0.5" stroke-width="0.8"/>
    </g>
  </symbol>
</defs></svg>
</div>
<div id="err"></div>
<!-- Artist-modal mount: the .am-overlay shell from artist-modal.css. Ids match AM.mount. -->
<div class="am-overlay" id="artistModal">
  <div class="artist-modal" role="dialog" aria-label="Artist">
    <div id="artistModalBody"></div>
  </div>
</div>
<div id="rotateHint"><span>rotate your phone for the full map</span><button id="goLandscape" type="button" hidden>go landscape</button></div>
<div id="zoomer">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">&minus;</button>
  <button id="zfit" title="Fit map">&#8962;</button>
</div>
<div id="plate">
  <h1 id="plateGrip"><span>Guitarlandria</span><span class="shaded-name" id="shadedName"></span><button id="shadeBtn" type="button" title="Collapse">&#9650;</button></h1>
  <div id="readout" class="idle"><div class="name">Hover a settlement to read the plate.</div></div>
  <input id="finder" type="search" placeholder="find a settlement&hellip;" autocomplete="off" spellcheck="false">
  <div id="findmsg"></div>
  <div id="editctl" style="display:none;border-top:1px solid rgba(34,26,18,.35);padding-top:7px;margin-top:2px;">
    <div id="editwho" style="font-size:12.5px;font-weight:600;margin-bottom:4px;">select a settlement&hellip;</div>
    <select id="ovRegion" style="width:54%;font-family:'Oswald';font-size:12px;border:1.5px solid var(--ink);background:#f6eed9;padding:3px;"></select>
    <select id="ovSize" style="width:42%;font-family:'Oswald';font-size:12px;border:1.5px solid var(--ink);background:#f6eed9;padding:3px;">
      <option>hamlet</option><option>waystation</option><option>village</option><option>town</option><option>city</option><option>capital</option>
    </select>
    <button id="exclOv" title="not an act the map should know about - leaves the map on the next rebuild" style="margin-top:5px;font-family:'Special Elite',monospace;font-size:11px;border:1.5px solid var(--ink);background:transparent;padding:3px 8px;cursor:pointer;">exclude from map</button>
    <label style="display:block;font-size:11.5px;margin-top:5px;"><input type="checkbox" id="showStrays" checked> region strays (amber)</label>
    <div id="tracebar" style="margin-top:7px;border-top:1px dashed rgba(34,26,18,.3);padding-top:6px;">
      <button id="traceBtn" style="font-family:'Special Elite',monospace;font-size:11px;border:1.5px solid var(--ink);background:transparent;padding:3px 8px;cursor:pointer;">trace waterway</button>
      <input id="traceName" placeholder="name / note for this waterway &mdash; Enter to save">
      <div id="traceMsg" style="font-size:10.5px;margin-top:3px;min-height:12px;"></div>
    </div>
  </div>
  <div id="legend">
    <div class="lgrow"><span class="lgk">features</span><label><input type="checkbox" data-t="maplabels" checked> labels</label><label><input type="checkbox" data-t="routes" checked> routes</label></div>
    <div class="lgrow"><span class="lgk">settlements</span><label><input type="checkbox" data-t="names" checked> names</label><label><input type="checkbox" data-t="waystation" checked> unvisited</label></div>
    <div style="margin-top:6px;font-size:10px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;">
      <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="rgba(237,224,194,.9)" stroke="#3d6b45" stroke-width="1.2" stroke-dasharray="1.6 1.4"/></svg> unvisited</span>
      <span><svg width="12" height="14"><path d="M6 1 L8.4 4.6 L3.6 4.6 Z" fill="#3d6b45" stroke="#221A12" stroke-width=".5"/><circle cx="6" cy="9" r="4" fill="#C9962E" stroke="#221A12"/></svg> legend</span>
      <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="none" stroke="#7a5a33" stroke-width="1.4" stroke-dasharray="4.5 3.5"/></svg> ruin</span>
      <span><svg width="12" height="12" viewBox="-5 -5 10 10" style="color:var(--ink)"><use href="#hm-anchor" x="-5" y="-5" width="10" height="10"/></svg> harbor</span>
    </div>
    <div id="ownerControls" style="display:none">
      <label><input type="checkbox" id="editMode"> edit</label>
      <label><input type="checkbox" id="traceMode"> trace rivers</label>
      <div id="saveBlock" style="display:none">
        <button id="saveAll" style="margin-top:4px;font-family:'Special Elite',monospace;
          font-size:11px;border:1.5px solid var(--ink);background:transparent;padding:3px 8px;cursor:pointer;">
          save changes (0)</button>
        <span class="save-ind" id="ind-save" style="font-size:10.5px;margin-left:4px;"></span>
        <div id="saveStatus" style="font-size:10.5px;opacity:.85;line-height:1.5;"></div>
      </div>
    </div>
  </div>
  <div id="plateFoot">Recorded Settlements</div>
</div>
<script>
(async function(){
  const NS='http://www.w3.org/2000/svg';
  const qs=new URLSearchParams(location.search);
  const SVG_BG=qs.get('svg')||'art/map.svg';
  const DATA=qs.get('data')||'build/fantasy_map_data.json';
  const map=document.getElementById('map');
  // Artist modal. basePath lifts its repo-relative data fetches out of tools/map/; configUrl
  // lets the module read site.owner and features.* itself, since this page has no app.js and
  // therefore no SITE_CONFIG. No write path is passed, so the favorite gauge is read-only
  // here exactly as it is on the graph.
  amInit({basePath:'../../',mount:'artistModal',theme:'map',configUrl:'../../config.yaml'});
  const err=m=>{const e=document.getElementById('err');e.style.display='block';e.textContent=m;};
  // cache:'no-store' defeats the browser cache but not the Pages CDN edge; a per-load
  // query string is what actually fetches the file that was just committed (the
  // background image below already does this, and artist-modal.js does it for its data)
  const fresh=u=>u+(u.includes('?')?'&':'?')+'t='+Date.now();

  // Owner-only edit/trace tooling is gated on the same PAT the list pages (app.js)
  // store, so a token saved there just works here too — no separate auth surface on
  // the map. For an authed user this also grants write capability: the save button
  // below commits straight to staging with this same PAT.
  const PAT_KEY='ghpat_liveshows';
  const authed=!!localStorage.getItem(PAT_KEY);
  // A coarse pointer is the honest test for "a device": true on phones and tablets whatever
  // their width, false on a narrow desktop window where hover and the editor still make sense.
  // Edit and trace are desktop-only; a device gets the viewing surface and the card.
  const DEVICE=matchMedia('(pointer: coarse)').matches;
  if(DEVICE)document.body.classList.add('device');
  const portraitQ=matchMedia('(orientation: portrait)');
  const setPortrait=()=>document.body.classList.toggle('portrait',DEVICE&&portraitQ.matches);
  setPortrait();portraitQ.addEventListener('change',setPortrait);
  if(authed&&!DEVICE){const oc=document.getElementById('ownerControls');if(oc)oc.style.display='';}

  // Repo + branch this page commits to. map.html has no config.yaml of its own
  // (unlike app.js's dataBranch(), which reads site.data_branch) — this fork's
  // data branch is 'staging' (auto-promote.yml fast-forwards main from there),
  // so it's hardcoded here rather than duplicating a config loader for one value.
  const OWNER='dan2bit', REPO='live-shows', BRANCH='staging';

  // The hand-owned edits files. An authed editor reads them from BRANCH through the API,
  // where its saves land, not from the Pages copy, which trails a save by the promote and
  // the deploy (a few minutes): a reload inside that window showed a save as lost, and
  // re-editing the same route or override from that stale copy wrote the stale parts back
  // over it. Everyone else reads the Pages copy. Falls back to Pages if the API read fails.
  async function loadEdit(name,asText){
    if(authed){
      try{
        const r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/tools/map/edits/'+name+'?ref='+encodeURIComponent(BRANCH),
          {cache:'no-store',headers:{'Accept':'application/vnd.github.raw','Authorization':'token '+localStorage.getItem(PAT_KEY)}});
        if(r.ok)return asText?await r.text():await r.json();
      }catch(e){}
    }
    const r=await fetch(fresh('edits/'+name),{cache:'no-store'});
    return asText?await r.text():await r.json();
  }
  // Contents-API read-merge-write. The GET that fetches the fresh SHA (per the repo's
  // commit rules - never reuse a SHA from an earlier read) also returns the file's
  // current content on BRANCH; `merge` is handed that decoded object and returns what
  // to write. A page holds its copy of these files from load, and several pages can be
  // open at once, so writing the session's whole snapshot back was last-writer-wins: a
  // tab opened before someone's save silently reverted it on its own next save. Merging
  // this session's changes into the file as it is now closes that. Mirrors app.js's
  // ghFetchForWrite + raw-fetch-PUT pattern otherwise; inlined here since map.html has
  // no shared script include with the list pages. Returns {result, merged}.
  async function ghCommitJson(path,merge,message,fmt){
    const pat=localStorage.getItem(PAT_KEY);
    if(!pat) throw new Error('no auth');
    const headers={'Accept':'application/vnd.github.v3+json','Authorization':'token '+pat};
    const getUrl='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path+'?ref='+encodeURIComponent(BRANCH);
    const fd=await (await fetch(getUrl,{cache:'no-store',headers})).json();
    if(!fd.sha) throw new Error('could not read current sha for '+path);
    let remote=null;
    try{ remote=JSON.parse(decodeURIComponent(escape(atob((fd.content||'').replace(/\n/g,''))))); }catch(e){ remote=null; }
    const merged=merge(remote);
    const body=fmt?fmt(merged):JSON.stringify(merged,null,1)+'\n';
    const putRes=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{
      method:'PUT',
      headers:Object.assign({'Content-Type':'application/json'},headers),
      body:JSON.stringify({message,content:btoa(unescape(encodeURIComponent(body))),sha:fd.sha,branch:BRANCH})
    });
    if(!putRes.ok) throw new Error(await putRes.text());
    return {result:await putRes.json(),merged};
  }
  // Save-indicator: same three-state pattern app.js uses for inline edits
  // ('…' in flight, '✓' ok, '✗ <msg>' err) — inlined here for the same reason
  // as ghCommitJson above.
  function setInd(id,state,msg){
    const el=document.getElementById(id);if(!el)return;
    el.className='save-ind';
    if(state==='pending'){el.textContent='…';}
    else if(state==='ok'){el.textContent='✓';el.classList.add('ok');}
    else if(state==='err'){el.textContent='✗ '+(msg||'error').slice(0,60);el.classList.add('err');}
    else{el.textContent='';}
  }

  let data;
  try{ data=await (await fetch(fresh(DATA),{cache:'no-store'})).json(); }
  catch(e){ return err(`Could not load ${DATA} — serve over http (python3 -m http.server), not file://`); }

  const W=data.canvas.w,H=data.canvas.h;
  const bg=document.createElementNS(NS,'image');
  bg.setAttribute('href',SVG_BG+(SVG_BG.includes('?')?'&':'?')+'v='+Date.now());
  bg.setAttribute('x',0);bg.setAttribute('y',0);bg.setAttribute('width',W);bg.setAttribute('height',H);
  bg.addEventListener('error',()=>err(`Could not load ${SVG_BG} — pass ?svg=YourExport.svg`));
  map.appendChild(bg);

  const gRegions=document.createElementNS(NS,'g');
  const gStl=document.createElementNS(NS,'g');
  const gRoutes=document.createElementNS(NS,'g');   // #406 thoroughfares test layer: under the marks, over the hulls
  gRoutes.setAttribute('id','routes');
  map.append(gRegions,gRoutes,gStl);

  const TINT={delta_coast:'var(--coast)',amplified_range:'var(--range)',slide_foothills:'var(--foothills)',
              heartland:'var(--heart)',river_port:'var(--port)',quiet_woods:'var(--woods)',outer_isles:'var(--isles)'};
  const S=new Map(data.settlements.map(s=>[s.name,s]));
  let LBL={regions:{},islands:{},waters:{}};
  try{ LBL=await loadEdit('labels.json'); }catch(e){}
  // pins.json is position truth - render it live, don't wait for the rebuild bot
  let PINFILE={};
  try{ PINFILE=await loadEdit('pins.json'); }catch(e){}

  // Dan's viewer overrides: {name: {region?, size?, exclude?}}. One object, shared by the
  // editor panel and the staleness banner below, both of which record decisions into it.
  // Loaded here, ahead of the banner, so a decision made from the banner lands in the
  // same object the editor edits.
  const overrides={};
  let THOR={routes:[]},COAST;   // thoroughfares.json and coast.json, fetched with the routes block below
  const editctl=document.getElementById('editctl'),
        ovRegion=document.getElementById('ovRegion'), ovSize=document.getElementById('ovSize'),
        editwho=document.getElementById('editwho');
  if(authed){
  try{ Object.assign(overrides, await loadEdit('map_overrides.json')); }catch(e){}
  ovRegion.innerHTML=data.regions.map(r=>`<option value="${r.id}">${r.label}</option>`).join('');
  }

  // ── one save for the four editable files ──
  // The page tracks WHAT it changed, not just the whole object: pins and overrides by
  // touched name (an absent name is a deletion), labels by "group:key", traces by how many
  // it appended. That is what read-merge-write needs - each save fetches the file as it is
  // now on staging and folds only this session's changes into it - and it is what lets one
  // button write only the files that actually changed, one Contents-API commit each (a
  // Git-Data batch would be one commit, but does not fire the push event auto-promote
  // listens for). A file this page never touched is never written.
  // Each touched key maps to the touch that last changed it, so a save can tell a key it
  // wrote from one touched again while the save was in flight (that one stays dirty).
  const dirty={pins:new Map(),overrides:new Map(),labels:new Map(),traces:0,thor:new Map()};
  let touchSeq=0;
  const saveAllBtn=document.getElementById('saveAll'),saveStatus=document.getElementById('saveStatus');
  const dirtyCount=()=>dirty.pins.size+dirty.overrides.size+dirty.labels.size+dirty.traces+dirty.thor.size;
  function refreshSave(){
    if(!authed)return;
    saveAllBtn.textContent=`save changes (${dirtyCount()})`;
    const part=(n,total,label)=>n?`<b>${label} ${total}</b> (${n} unsaved)`:`${label} ${total}`;
    // pins: drawn/undrawn. Undrawn entries are pins for names the map does not draw
    // (merged, excluded, or off the roster); they stay so a returning act lands where
    // it was last placed.
    const pinNames=Object.keys(pins),pinDrawn=pinNames.filter(n=>S.has(n)).length;
    const pinTotal=`<span title="pins on drawn settlements / pins for names not drawn (merged, excluded or off the roster)">${pinDrawn}/${pinNames.length-pinDrawn}</span>`;
    saveStatus.innerHTML=[part(dirty.pins.size,pinTotal,'pins'),part(dirty.overrides.size,Object.keys(overrides).length,'overrides'),
      part(dirty.labels.size,Object.keys(LBL.regions||{}).length+Object.keys(LBL.islands||{}).length+Object.keys(LBL.waters||{}).length,'labels'),
      part(dirty.traces,TRACES.length,'waterways'),part(dirty.thor.size,(THOR.routes||[]).length,'routes')].join(' \u00b7 ');
    // the builder's override audit (meta.override_audit_counts): only the classes that ask for a hand
    const ac=(data.meta&&data.meta.override_audit_counts)||{};
    const asks=['flipped','redundant','orphan'].filter(k=>ac[k]).map(k=>`${ac[k]} ${k}`);
    if(asks.length)saveStatus.innerHTML+=` \u00b7 <b>audit:</b> ${asks.join(', ')}`;
  }
  function touch(kind,key){ if(kind==='traces')dirty.traces++; else dirty[kind].set(key,++touchSeq); refreshSave(); }
  function markOv(name,key,val){
    (overrides[name]??={})[key]=val;
    touch('overrides',name);
  }
  // Merge helpers: fold this session's touched entries into the file as it is now.
  const mergeByName=(local,names)=>remote=>{ const out=(remote&&typeof remote==='object'&&!Array.isArray(remote))?remote:{};
    for(const n of names){ if(n in local)out[n]=local[n]; else delete out[n]; } return out; };
  const adopt=(local,merged)=>{ for(const k of Object.keys(local))delete local[k]; Object.assign(local,merged); };
  // A save takes a snapshot of one kind's dirty keys, writes those, then settles: a key
  // still at the touch it was written at is clean; a key touched again in flight, or first
  // touched in flight, stays dirty. adopt() replaces the local copy with what was written,
  // so the still-dirty keys' local values are held across it and put back - an edit made
  // while a save runs survives to the next save instead of being dropped.
  const settle=(kind,taken)=>{ for(const [k,n] of taken)if(dirty[kind].get(k)===n)dirty[kind].delete(k); return [...dirty[kind].keys()]; };
  const adoptKeeping=(local,merged,keep)=>{ const held=keep.map(k=>[k,k in local,local[k]]); adopt(local,merged);
    for(const [k,had,v] of held){ if(had)local[k]=v; else delete local[k]; } };
  async function saveAll(indId){
    const ind=indId||'ind-save';
    if(typeof tracing!=='undefined'&&tracing)endTrace();
    setInd(ind,'pending'); saveAllBtn.disabled=true;
    let ok=true;
    try{
      if(dirty.pins.size){
        const taken=new Map(dirty.pins);
        const {merged}=await ghCommitJson('tools/map/edits/pins.json',mergeByName(pins,[...taken.keys()]),`map: update pins (${taken.size} changed) via in-page editor`);
        adoptKeeping(pins,merged,settle('pins',taken));
      }
      if(dirty.overrides.size){
        const taken=new Map(dirty.overrides);
        const {merged}=await ghCommitJson('tools/map/edits/map_overrides.json',mergeByName(overrides,[...taken.keys()]),`map: update overrides (${taken.size} changed) via in-page editor`);
        adoptKeeping(overrides,merged,settle('overrides',taken));
      }
      if(dirty.labels.size){
        const taken=new Map(dirty.labels),keys=[...taken.keys()];
        const split=k=>{const i=k.indexOf(':');return [k.slice(0,i),k.slice(i+1)];};
        const {merged}=await ghCommitJson('tools/map/edits/labels.json',remote=>{
          const out=(remote&&typeof remote==='object')?remote:{}; for(const g of ['regions','islands','waters'])out[g]??={};
          for(const k of keys){ const [g,id]=split(k); if(LBL[g]&&id in LBL[g])out[g][id]=LBL[g][id]; else delete out[g][id]; }
          return out; },`map: update labels (${keys.length} changed) via in-page editor`);
        const held=settle('labels',taken).map(k=>{const [g,id]=split(k);return [g,id,!!(LBL[g]&&id in LBL[g]),LBL[g]&&LBL[g][id]];});
        LBL=merged;
        for(const [g,id,had,v] of held){ LBL[g]??={}; if(had)LBL[g][id]=v; else delete LBL[g][id]; }
      }
      if(dirty.traces){
        const n=dirty.traces,end=TRACES.length,added=TRACES.slice(end-n,end);
        const {merged}=await ghCommitJson('tools/map/edits/traced_waterways.json',remote=>{
          const base=Array.isArray(remote)?remote:[];
          added.forEach((t,i)=>{ t.id=`wway-${base.length+i+1}`; });   // renumber behind whatever landed meanwhile
          return base.concat(added); },`map: add ${added.length} traced waterway${added.length>1?'s':''} via in-page editor`);
        const late=TRACES.slice(end);   // traced while the save ran: kept, still unsaved
        TRACES.length=0; TRACES.push(...merged,...late); dirty.traces-=n;
      }
      if(dirty.thor.size){
        const taken=new Map(dirty.thor),keys=[...taken.keys()];
        const {merged}=await ghCommitJson('tools/map/edits/thoroughfares.json',remote=>{
          const out=(remote&&typeof remote==='object'&&!Array.isArray(remote))?remote:{routes:[]}; out.routes??=[];
          for(const k of keys){ const mine=THOR.routes.find(r=>routeKey(r)===k),j=out.routes.findIndex(r=>routeKey(r)===k);
            if(mine){ if(j>=0)out.routes[j]=mine; else out.routes.push(mine); } else if(j>=0)out.routes.splice(j,1); }
          return out; },`map: update thoroughfares (${keys.length} route${keys.length>1?'s':''}) via in-page editor`,fmtThor);
        const keep=settle('thor',taken);
        if(dragV&&selRoute&&!keep.includes(selRoute.key))keep.push(selRoute.key);   // a drag in progress is not touched until it ends
        const held=keep.map(k=>[k,THOR.routes.find(r=>routeKey(r)===k)]);
        THOR=merged; THOR.routes??=[];
        for(const [k,mine] of held){ const j=THOR.routes.findIndex(r=>routeKey(r)===k);
          if(mine){ if(j>=0)THOR.routes[j]=mine; else THOR.routes.push(mine); } else if(j>=0)THOR.routes.splice(j,1); }
        if(selRoute){ selRoute.r=THOR.routes.findIndex(r=>routeKey(r)===selRoute.key); if(selRoute.r<0){selRoute=null;dragV=null;} }
        drawThoroughfares(); drawHandles();
      }
    }catch(e){ ok=false; console.error(e); setInd(ind,'err',e.message); }
    if(ok)setInd(ind,'ok');
    saveAllBtn.disabled=false; refreshSave();
    return ok;
  }
  if(authed){
    saveAllBtn.addEventListener('click',()=>saveAll('ind-save'));
    window.addEventListener('beforeunload',e=>{ if(dirtyCount()>0){e.preventDefault();e.returnValue='';} });
  }

  // #366: roster staleness — is fantasy_map_data.json behind recommend_index.json?
  // (async: its first await yields, so the synchronous flag refresh below runs before it reads flags)
  (async()=>{
    if(!authed||DEVICE) return;   // the panel is an editing aid: authed, desktop, and (below) edit mode only
    let idx=null;
    for(const p of ['/data/recommend_index.json','../../data/recommend_index.json']){
      try{ idx=await (await fetch(fresh(p),{cache:'no-store'})).json(); if(idx) break; }catch(e){}
    }
    if(!idx||!idx.records) return;
    const onMap=new Set(data.settlements.map(s=>s.name));
    // Names the builder leaves off on purpose (MAP_EXCLUDE) or folds into another
    // settlement (MERGES) are not "missing" - the builder publishes both lists in meta.
    const meta=data.meta||{};
    const notRoster=new Set([...(meta.excluded||[]),...Object.keys(meta.merged||{}),...(meta.suppressed||[])]);
    const missing=idx.records.map(r=>r.canonical).filter(n=>!onMap.has(n)&&!PINFILE[n]&&!notRoster.has(n));
    const recByName=new Map(idx.records.map(r=>[r.canonical,r]));
    // Two different facts, kept apart: "unplaced" is the builder's flag and is what the
    // pink halo shows; "no pin" is a builder-positioned settlement with no pins.json
    // entry (Outer Isles sits on fixed pegs and is left out of that count).
    const unplaced=data.settlements.filter(s=>s.flags&&s.flags.unplaced).map(s=>s.name);
    const nopin=data.settlements.filter(s=>s.flags&&s.flags.unpinned).map(s=>s.name);
    if(missing.length===0) return;
    const clause=(n,txt,names)=>n?` · <span title="${names.slice(0,20).join(', ').replace(/"/g,'&quot;')}">${n} ${txt}</span>`:'';
    const b=document.createElement('div');
    b.id='rosterBanner';
    b.style.cssText='position:absolute;top:8px;left:8px;max-width:340px;background:rgba(166,61,47,.93);color:#EDE0C2;font-family:Oswald;font-size:12px;padding:7px 10px;border:1.5px solid #221A12;z-index:9;';
    const head=document.createElement('div');
    head.className='rb-head';
    head.innerHTML=`<b>${missing.length} roster artist${missing.length>1?'s':''} not on the map</b>`
      +`<button id="rbShadeBtn" type="button" title="Collapse">&#9650;</button>`;
    b.appendChild(head);
    const body=document.createElement('div');
    body.innerHTML=clause(unplaced.length,'awaiting hand placement (haloed)',unplaced)
      +clause(nopin.length,'builder-placed, no pin',nopin)
      +` — map data is behind recommend_index.<br>`
      +`<span style="font-size:10.5px;opacity:.9">rebuild: GitHub → Actions → “Rebuild fantasy map data” → Run workflow · or: <code>gh workflow run map-rebuild.yml</code></span>`;
    head.querySelector('#rbShadeBtn').addEventListener('click',()=>{
      const sh=b.classList.toggle('shaded');
      head.querySelector('#rbShadeBtn').innerHTML=sh?'&#9660;':'&#9650;';
      head.querySelector('#rbShadeBtn').title=sh?'Expand':'Collapse';
    });
    b.appendChild(body);
    // The names have no mark to click yet, so the decisions a new name needs - which region,
    // or none at all - are taken here, ahead of its first placement. Each row writes into
    // the same overrides object the editor saves; the builder honours both keys.
    const list=document.createElement('div');
    list.style.cssText='margin-top:5px;border-top:1px solid rgba(237,224,194,.35);padding-top:4px;max-height:220px;overflow:auto;';
    const decided=new Set();
    const ctl='font-family:Oswald;font-size:11px;border:1px solid #EDE0C2;background:rgba(237,224,194,.12);color:#EDE0C2;padding:1px 4px;';
    // A name alone assumes the reader knows every act on the roster, which stops being true
    // the moment a support act is harvested from someone else's bill. Each row therefore says
    // how the name got onto the roster (from the record the panel already holds), opens the
    // artist card on the name, and offers two research links for a name the card does not know.
    const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    const prov=r=>{ if(!r)return''; const s=r.status||'';
      if(s==='seen')         return `seen ${r.times_seen||'?'}x \u00b7 ${r.first_seen||'?'}${r.most_recent_seen&&r.most_recent_seen!==r.first_seen?'\u2013'+r.most_recent_seen:''}`;
      if(s==='seen-support') return `support act \u00b7 ${r.appearances||1} bill${+(r.appearances||1)>1?'s':''}${r.bill?' \u00b7 with '+r.bill:''}${r.first_seen?' \u00b7 '+r.first_seen:''}`;
      if(s==='potential')    return `potential${r.decision?' \u00b7 '+r.decision:''}${r.bill?' \u00b7 on '+r.bill+'\u2019s bill':''}`;
      if(s==='fast_track')   return 'fast track';
      if(s==='follow')       return `follow${r.tier?' \u00b7 '+r.tier:''}`;
      return s; };
    const links=n=>`<a href="https://www.last.fm/music/${encodeURIComponent(n)}" target="_blank" rel="noopener" title="Last.fm">lfm</a>`
      +`<a href="https://www.bandsintown.com/?q=${encodeURIComponent(n)}" target="_blank" rel="noopener" title="Bandsintown">bit</a>`;
    for(const n of missing.slice(0,40)){
      const rec=recByName.get(n),row=document.createElement('div');
      row.style.cssText='display:flex;gap:5px;align-items:center;margin:2px 0;';
      const ov=overrides[n]||{};
      row.innerHTML=`<span style="flex:1;min-width:0;overflow:hidden;line-height:1.15">`
        +`<button class="rb-name" type="button" title="open the artist card">${esc(n)}</button>`

      const X=+mx.toFixed(0),Y=+my.toFixed(0);
      if(dragL.dataset.rid){ (LBL.regions[dragL.dataset.rid]??={}).xy=[X,Y]; touch('labels','regions:'+dragL.dataset.rid); }
      else if(dragL.dataset.gkind==='island'){ LBL.islands[dragL.dataset.gname]=[X,Y]; touch('labels','islands:'+dragL.dataset.gname); }
      else { LBL.waters[dragL.dataset.gname]=[X,Y]; touch('labels','waters:'+dragL.dataset.gname); }
      readout.innerHTML=`<div class="nm">${dragL.dataset.rid||dragL.dataset.gname}</div><div class="stats">(${X}, ${Y}) \u2014 in labels.json</div>`;
      return;
    }
    if(dragS){
      const [mx,my]=toMap(e.clientX,e.clientY);
      dragS.g.setAttribute('transform',`translate(${mx.toFixed(1)},${my.toFixed(1)})`);
      if(dragS.name){dragS.moved=true;pinHere(dragS.g,[mx,my]);}
      return;
    }
    if(!pan)return;
    const r=map.getBoundingClientRect();
    vb.x-=(e.clientX-pan.x)/r.width*vb.w;vb.y-=(e.clientY-pan.y)/r.height*vb.h;
    pan={x:e.clientX,y:e.clientY};apply();
  });
  const endTouch=e=>{touches.delete(e.pointerId);if(touches.size<2)pinch=null;};
  stage.addEventListener('pointercancel',e=>{endTouch(e);pan=null;dragS=null;dragL=null;downAt=null;stage.classList.remove('panning');});
  stage.addEventListener('pointerup',e=>{
    if(pinch||(e.pointerType==='touch'&&!downAt)){endTouch(e);if(!pinch)stage.classList.remove('panning');return;}
    endTouch(e);
    if(dragV){routeChanged();dragV=null;return;}
    if(dragS&&dragS.moved)placeLabels();   // a moved mark changes its neighbours' best slots too
    // click (not drag) in edit mode on an unpinned settlement pins it where it stands
    if(dragS&&!dragS.moved&&downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])<4){
      const st=S.get(dragS.name);
      if(st&&!pins[dragS.name]&&st.region!=='outer_isles'){pinHere(dragS.g,st.xy);
        findmsg.textContent=`pinned ${dragS.name} where it stands`;}
    }
    // click (not drag) in view mode: a visible NAME opens the card, the dot toggles the label
    if(!dragS&&!dragL&&downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])<4
       &&!(authed&&window.editCb&&editCb.checked)&&!document.body.classList.contains('tracing')){
      const g=e.target.closest&&e.target.closest('.stl');
      if(g&&e.target.closest('text.lbl'))openSettlementCard(g);
      else if(g){g.classList.toggle('pinlabel');if(g._readout)g._readout();}
    }
    pan=null;dragS=null;dragL=null;downAt=null;stage.classList.remove('panning');
  });
  // ── artist card: three ways in, none of which spends the dot's click budget ──
  // The canonical name is always what the modal opens on; s.label (the short form the
  // canvas may be printing) rides along as context only.
  let readoutFor=null;
  function openSettlementCard(g){
    if(!g||typeof openArtistModal!=='function')return;
    openArtistModal(g.dataset.name,g._amCtx?g._amCtx():null);
  }
  // The plate readout works in EVERY mode, including edit and trace where the canvas path is
  // off, and gives touch a route: tap the dot, then tap the name on the plate.
  readout.addEventListener('click',e=>{
    if(e.target.closest('.name.am-open')&&readoutFor)openSettlementCard(readoutFor);
  });
  // Finder: Enter on exactly one match opens its card, after the input handler has zoomed to it.
  finder.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const q=fold(finder.value.trim());
    if(q.length<2)return;
    const hits=[...gStl.querySelectorAll('.stl')].filter(g=>fold(g.dataset.name||'').includes(q));
    if(hits.length===1){e.preventDefault();openSettlementCard(hits[0]);}
  });
  window.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    // With the card open Esc closes it and nothing else - the click-labels survive, so
    // dismissing the card does not also wipe the labels the reader just set up.
    const am=document.getElementById('artistModal');
    if(am&&am.classList.contains('open')){closeArtistModal();return;}
    if(selRoute){selRoute=null;drawThoroughfares();drawHandles();return;}
    document.querySelectorAll('.stl.pinlabel').forEach(g=>g.classList.remove('pinlabel'));
  });
  // Deep link: #artist/<slug> on this page opens the card AND recentres on that settlement
  // (finder-style pan, zoom untouched). A card opened by clicking never moves the map.
  function amRecentre(){
    const m=(location.hash||'').match(/^#artist\/(.+)$/);
    if(!m)return;
    const want=decodeURIComponent(m[1]);
    // amSlugify, not a local copy: amNorm de-inverts "X, The" and drops a leading article,
    // so a hand-rolled slug would silently miss "The Teskey Brothers" and never recentre.
    if(typeof amSlugify!=='function')return;
    const g=[...gStl.querySelectorAll('.stl')].find(x=>amSlugify(x.dataset.name||'')===want);
    if(!g)return;
    const t=/translate\(([-\d.]+),([-\d.]+)\)/.exec(g.getAttribute('transform'));
    if(t){vb.x=+t[1]-vb.w/2;vb.y=+t[2]-vb.h/2;apply();}
  }
  // Only a hash arriving while the card is SHUT recentres the map.
  //
  // Opening a card writes #artist/<slug>, so it fires hashchange itself - and recentring on
  // that panned the map out from under the reader on every click, with no way back, since
  // closing uses replaceState and fires no event to undo it. A click must not move the map;
  // only arriving at a hash from outside should.
  //
  // The open-state test is sufficient on its own: openArtistModal() calls amShow() before
  // its first await, so any hashchange we cause is guaranteed to land with the overlay
  // already open. That also covers navigation from inside the card (a Similar chip), which
  // would otherwise slide the map silently behind the overlay.
  window.addEventListener('hashchange',()=>{
    const am=document.getElementById('artistModal');
    if(am&&am.classList.contains('open'))return;
    amRecentre();
  });
  amRecentre();   // a real deep link on load: nothing is open yet
  apply();

  // the plate drags by its title bar
  const plate=document.getElementById('plate'),grip=document.getElementById('plateGrip');
  let pd=null;
  // windowshade: collapse the plate to just its title bar. The hovered name is fed into
  // #shadedName from the same mouseenter handler readout already uses, so the one thing
  // the plate is for mid-hover survives the collapse that hides the readout itself.
  const shadeBtn=document.getElementById('shadeBtn');
  const setShade=sh=>{plate.classList.toggle('shaded',sh);shadeBtn.innerHTML=sh?'&#9660;':'&#9650;';shadeBtn.title=sh?'Expand':'Collapse';};
  shadeBtn.addEventListener('click',e=>{e.stopPropagation();setShade(!plate.classList.contains('shaded'));});
  // Collapsed, the name in the bar is the card link - tap a dot, tap the name.
  document.getElementById('shadedName').addEventListener('click',e=>{e.stopPropagation();if(readoutFor)openSettlementCard(readoutFor);});
  if(DEVICE)setShade(true);
  // Landscape on demand. Fullscreen plus an orientation lock rotates the whole display -
  // map, plate, controls, pointer math all untouched - so it is the only path offered; the
  // button exists only where both APIs do (feature-detected, never shown-and-failing). The
  // text beside it stands on its own as the nudge everywhere else.
  const goL=document.getElementById('goLandscape');
  const canLock=!!(document.documentElement.requestFullscreen&&screen.orientation&&screen.orientation.lock);
  if(DEVICE&&canLock){
    goL.hidden=false;
    goL.addEventListener('click',async()=>{
      try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape');}
      catch(err){goL.hidden=true;}
    });
    document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&screen.orientation.unlock)try{screen.orientation.unlock();}catch(err){}});
  }
  grip.addEventListener('pointerdown',e=>{
    if(e.target.closest('#shadeBtn'))return;
    const b=plate.getBoundingClientRect();
    plate.style.top=b.top+'px';plate.style.left=b.left+'px';plate.style.transform='none';
    pd={dx:e.clientX-b.left,dy:e.clientY-b.top};grip.setPointerCapture(e.pointerId);e.preventDefault();
  });
  grip.addEventListener('pointermove',e=>{
    if(!pd)return;
    plate.style.left=Math.max(4,Math.min(innerWidth-plate.offsetWidth-4,e.clientX-pd.dx))+'px';
    plate.style.top=Math.max(4,Math.min(innerHeight-plate.offsetHeight-4,e.clientY-pd.dy))+'px';
  });
  grip.addEventListener('pointerup',()=>{pd=null;});

})();
</script>
</body>
</html>
