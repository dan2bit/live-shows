<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitarlandria — Red Hat Atlas</title>
<link rel="canonical" href="https://redhat-bootlegs.net/tools/map/map.html">

<meta property="og:description" content="Guitarlandria — Red Hat Atlas: a fantasy-map rendering of tracked live-shows artists as settlements, grouped by genre region, sized by how often seen live.">

<link rel="icon" type="image/png" sizes="32x32" href="../../static/favicon.png">
<link rel="shortcut icon" type="image/png" href="../../static/favicon.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE0C2; --ink:#221A12; --gold:#C9962E;
    --coast:#2E4A6B; --range:#8a5a2a; --foothills:#7a6db0; --heart:#8A6A1F;
    --port:#A63D2F; --woods:#3d6b45; --isles:#5b8bb0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:#14100E;overflow:hidden;font-family:'Oswald',sans-serif;}
  #stage{position:absolute;inset:0;cursor:grab;}
  #stage.panning{cursor:grabbing;}
  #map{display:block;width:100%;height:100%;}

  /* regions: soft hulls and ghost labels */
  .region-hull{fill:var(--tint);fill-opacity:.05;stroke:var(--tint);stroke-opacity:.5;
    stroke-width:.8;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none;}
  .region-label{font-family:'Special Elite',monospace;fill:var(--tint);
    text-anchor:middle;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;
    paint-order:stroke;stroke:rgba(237,224,194,.8);stroke-width:3px;}

  .stl{cursor:pointer;pointer-events:bounding-box;}
  .stl circle{pointer-events:all;}
  .stl circle{stroke:var(--ink);vector-effect:non-scaling-stroke;}
  .stl .dot{fill:var(--tint,#4a3a26);}
  .stl.capital .ring{fill:none;stroke-width:1.2;}
  .stl.unvisited .dot{fill:rgba(237,224,194,.9);stroke:var(--tint);stroke-width:1.3;stroke-dasharray:1.6 1.4;}
  .stl.faded .dot{fill-opacity:.35;}
  .stl.legacy .dot{fill:var(--gold);}
  .stl .tick{stroke:var(--ink);stroke-width:.5;fill:var(--tint);}
  .stl.traced .traceno{font-size:5.5px;fill:#0e5a70;paint-order:stroke;stroke:rgba(237,224,194,.9);stroke-width:1.6px;}
  .stl.traced .dot{stroke:#0e5a70;stroke-width:1.6;}
  body.tracing .stl .dot{fill:rgba(237,224,194,.92);stroke:#FF2FA0;stroke-width:1.4;stroke-dasharray:none;opacity:1;}
  body.tracing .stl.tracedone .dot{fill:rgba(34,26,18,.28);stroke:rgba(34,26,18,.45);stroke-width:.8;}
  body.tracing .stl.traced .dot{fill:#0e5a70;stroke:#0e5a70;}
  body.tracing .stl text{opacity:.9;}
  #traceName{width:100%;font-family:'Oswald';font-size:12px;border:1.5px solid var(--ink);background:#f6eed9;padding:4px;margin-top:4px;display:none;}
  .tracepath{fill:none;stroke:#0e5a70;stroke-width:1.2;stroke-dasharray:3 2;opacity:.75;vector-effect:non-scaling-stroke;}
  .clicklabel{font-size:6.5px;paint-order:stroke;stroke:rgba(237,224,194,.85);stroke-width:2px;}
  .geo-island{font-family:'Special Elite',monospace;fill:#EDE0C2;letter-spacing:.1em;paint-order:stroke;stroke:rgba(34,26,18,.85);stroke-width:2.2px;}
  .geo-water{fill:#d9e6f0;font-style:italic;letter-spacing:.06em;paint-order:stroke;stroke:rgba(20,35,55,.9);stroke-width:2px;}
  #rose{opacity:.94;}
  #rose-home{pointer-events:all;cursor:pointer;}
  #rose-home:hover #rose-clef,#rose-home:focus-visible #rose-clef{stroke:#0e5a70;}
  #rose-home:hover circle,#rose-home:focus-visible circle{opacity:.85;}
  .region-label,.geo-island,.geo-water{pointer-events:none;}
  body.editing .region-label,body.editing .geo-island,body.editing .geo-water{pointer-events:all;cursor:move;}
  .stl.unplaced .halo{fill:none;stroke:#FF2FA0;stroke-width:1.7;stroke-dasharray:3 1.6;vector-effect:non-scaling-stroke;}
  .stl.ruin .dot{fill:none;stroke:#7a5a33;stroke-width:1.5;stroke-dasharray:4.5 3.5;}
  .stl.ruin text{opacity:.7;font-style:italic;}
  .stl .anchor-mark{font-size:5.5px;fill:#1d4f6e;paint-order:stroke;stroke:rgba(237,224,194,.8);stroke-width:1.6px;pointer-events:none;}
  .stl.found .foundring{fill:none;stroke:#FFDD35;stroke-width:2.2;vector-effect:non-scaling-stroke;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{stroke-opacity:1;}50%{stroke-opacity:.25;}}
  #finder{width:100%;font-family:'Oswald';font-size:13px;background:#f6eed9;border:1.5px solid var(--ink);padding:5px 7px;margin-top:9px;}
  #findmsg{font-family:'Special Elite',monospace;font-size:10.5px;margin-top:3px;min-height:13px;}
  .stl text{font-family:'Oswald';font-weight:500;fill:var(--ink);
    paint-order:stroke;stroke:rgba(237,224,194,.85);stroke-width:2.4px;pointer-events:none;}
  .stl:hover .dot{stroke-width:1.6;}

  #plate{
    position:absolute;left:18px;top:50%;transform:translateY(-50%);width:262px;
    background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 55%),var(--paper);
    border:2px solid var(--ink);outline:1px solid var(--paper);outline-offset:-6px;
    padding:0 16px 12px;box-shadow:0 8px 28px rgba(0,0,0,.55);color:var(--ink);
    touch-action:none;
  }
  #plate h1{
    font-family:'Special Elite',monospace;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;border-bottom:2px solid var(--ink);
    padding:13px 0 7px;cursor:move;user-select:none;
  }
  #readout{min-height:74px;padding:9px 0 7px;border-bottom:1px solid rgba(34,26,18,.35);}
  #readout .name{font-size:18px;font-weight:600;line-height:1.15;}
  #readout .where{font-family:'Special Elite',monospace;font-size:11.5px;letter-spacing:.06em;margin-top:2px;}
  #readout .stats{font-size:12.5px;margin-top:5px;line-height:1.5;}
  #readout.idle .name{opacity:.55;font-weight:400;font-size:14px;}
  #legend{padding-top:8px;font-size:12px;line-height:1.95;}
  #legend label{display:inline-flex;align-items:center;gap:5px;margin-right:9px;cursor:pointer;}
  #legend input{accent-color:var(--ink);}

  #zoomer{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;}
  #zoomer button{
    width:34px;height:34px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    font-family:'Special Elite',monospace;font-size:16px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4);
  }
  #zoomer button:hover{background:#f5ecd6;}
  #err{position:absolute;top:16px;left:16px;right:64px;color:var(--paper);
    font-family:'Special Elite',monospace;font-size:14px;line-height:1.7;display:none;}
  .save-ind{font-family:'Special Elite',monospace;}
  .save-ind.ok{color:#2e6b3d;}
  .save-ind.err{color:#a63d2f;}
</style>
</head>
<body>
<div id="stage"><svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<div id="err"></div>
<div id="zoomer">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">&minus;</button>
  <button id="zfit" title="Fit map">&#8962;</button>
</div>
<div id="plate">
  <h1 id="plateGrip">Guitarlandria - Red Hat Atlas</h1>
  <div id="readout" class="idle"><div class="name">Hover a settlement to read the plate.</div></div>
  <input id="finder" type="search" placeholder="find a settlement&hellip;" autocomplete="off" spellcheck="false">
  <div id="findmsg"></div>
  <div id="editctl" style="display:none;border-top:1px solid rgba(34,26,18,.35);padding-top:7px;margin-top:2px;">
    <div id="editwho" style="font-size:12.5px;font-weight:600;margin-bottom:4px;">select a settlement&hellip;</div>
    <select id="ovRegion" style="width:54%;font-family:'Oswald';font-size:12px;border:1.5px solid var(--ink);background:#f6eed9;padding:3px;"></select>
    <select id="ovSize" style="width:42%;font-family:'Oswald';font-size:12px;border:1.5px solid var(--ink);background:#f6eed9;padding:3px;">
      <option>hamlet</option><option>waystation</option><option>village</option><option>town</option><option>city</option><option>capital</option>
    </select>
    <button id="exportOv" style="margin-top:5px;font-family:'Special Elite',monospace;font-size:11px;border:1.5px solid var(--ink);background:transparent;padding:3px 8px;cursor:pointer;">save overrides (0)</button>
    <span class="save-ind" id="ind-ov" style="font-size:10.5px;margin-left:4px;"></span>
    <button id="exportLbl" style="margin-top:5px;font-family:'Special Elite',monospace;font-size:11px;border:1.5px solid var(--ink);background:transparent;padding:3px 8px;cursor:pointer;">save labels</button>
    <span class="save-ind" id="ind-lbl" style="font-size:10.5px;margin-left:4px;"></span>
    <div id="tracebar" style="margin-top:7px;border-top:1px dashed rgba(34,26,18,.3);padding-top:6px;">
      <button id="traceBtn" style="font-family:'Special Elite',monospace;font-size:11px;border:1.5px solid var(--ink);background:transparent;padding:3px 8px;cursor:pointer;">trace waterway</button>
      <button id="traceExp" style="font-family:'Special Elite',monospace;font-size:11px;border:1.5px solid var(--ink);background:transparent;padding:3px 8px;cursor:pointer;">save waterways (0)</button>
      <span class="save-ind" id="ind-trace" style="font-size:10.5px;margin-left:4px;"></span>
      <input id="traceName" placeholder="name / note for this waterway &mdash; Enter to save">
      <div id="traceMsg" style="font-size:10.5px;margin-top:3px;min-height:12px;"></div>
    </div>
  </div>
  <div id="legend">
    <label><input type="checkbox" data-t="regions" checked> regions</label>
    <label><input type="checkbox" data-t="waystation" checked> unvisited</label>
    <label><input type="checkbox" data-t="labels" checked> names</label>
    <label><input type="checkbox" data-t="geo" checked> geo names</label>
    <div style="margin-top:6px;font-size:10px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;">
      <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="rgba(237,224,194,.9)" stroke="#3d6b45" stroke-width="1.2" stroke-dasharray="1.6 1.4"/></svg> unvisited</span>
      <span><svg width="12" height="14"><path d="M6 1 L8.4 4.6 L3.6 4.6 Z" fill="#3d6b45" stroke="#221A12" stroke-width=".5"/><circle cx="6" cy="9" r="4" fill="#C9962E" stroke="#221A12"/></svg> legend</span>
      <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="none" stroke="#7a5a33" stroke-width="1.4" stroke-dasharray="4.5 3.5"/></svg> ruin</span>
      <span>&#9875; harbor</span>
    </div>
    <div id="ownerControls" style="display:none">
      <label><input type="checkbox" id="editMode"> edit</label>
      <label><input type="checkbox" id="traceMode"> trace rivers</label>
      <button id="exportPins" style="display:none;margin-top:4px;font-family:'Special Elite',monospace;
        font-size:11px;border:1.5px solid var(--ink);background:transparent;padding:3px 8px;cursor:pointer;">
        save pins (0)</button>
      <span class="save-ind" id="ind-pins" style="font-size:10.5px;margin-left:4px;"></span>
    </div>
  </div>
</div>
<script>
(async function(){
  const NS='http://www.w3.org/2000/svg';
  const qs=new URLSearchParams(location.search);
  const SVG_BG=qs.get('svg')||'map.svg';
  const DATA=qs.get('data')||'fantasy_map_data.json';
  const map=document.getElementById('map');
  const err=m=>{const e=document.getElementById('err');e.style.display='block';e.textContent=m;};

  // Owner-only edit/trace tooling is gated on the same PAT the list pages (app.js)
  // store, so a token saved there just works here too — no separate auth surface on
  // the map. For an authed user this also grants write capability: the four save
  // buttons below commit straight to staging with this same PAT.
  const PAT_KEY='ghpat_liveshows';
  const authed=!!localStorage.getItem(PAT_KEY);
  if(authed){const oc=document.getElementById('ownerControls');if(oc)oc.style.display='';}

  // Repo + branch this page commits to. map.html has no config.yaml of its own
  // (unlike app.js's dataBranch(), which reads site.data_branch) — this fork's
  // data branch is 'staging' (auto-promote.yml fast-forwards main from there),
  // so it's hardcoded here rather than duplicating a config loader for one value.
  const OWNER='dan2bit', REPO='live-shows', BRANCH='staging';

  // Contents-API PUT: fetch a fresh SHA immediately before writing (per the repo's
  // commit rules — never reuse a SHA from an earlier read), then PUT the full file
  // content to BRANCH. Mirrors app.js's ghFetchForWrite + raw-fetch-PUT pattern,
  // inlined here since map.html has no shared script include with the list pages.
  async function ghCommitJson(path,obj,message){
    const pat=localStorage.getItem(PAT_KEY);
    if(!pat) throw new Error('no auth');
    const headers={'Accept':'application/vnd.github.v3+json','Authorization':'token '+pat};
    const getUrl='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path+'?ref='+encodeURIComponent(BRANCH);
    const fd=await (await fetch(getUrl,{cache:'no-store',headers})).json();
    if(!fd.sha) throw new Error('could not read current sha for '+path);
    const body=JSON.stringify(obj,null,1)+'\n';
    const putRes=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{
      method:'PUT',
      headers:Object.assign({'Content-Type':'application/json'},headers),
      body:JSON.stringify({message,content:btoa(unescape(encodeURIComponent(body))),sha:fd.sha,branch:BRANCH})
    });
    if(!putRes.ok) throw new Error(await putRes.text());
    return putRes.json();
  }
  // Save-indicator: same three-state pattern app.js uses for inline edits
  // ('…' in flight, '✓' ok, '✗ <msg>' err) — inlined here for the same reason
  // as ghCommitJson above.
  function setInd(id,state,msg){
    const el=document.getElementById(id);if(!el)return;
    el.className='save-ind';
    if(state==='pending'){el.textContent='…';}
    else if(state==='ok'){el.textContent='✓';el.classList.add('ok');}
    else if(state==='err'){el.textContent='✗ '+(msg||'error').slice(0,60);el.classList.add('err');}
    else{el.textContent='';}
  }

  let data;
  try{ data=await (await fetch(DATA,{cache:'no-store'})).json(); }
  catch(e){ return err(`Could not load ${DATA} — serve over http (python3 -m http.server), not file://`); }

  const W=data.canvas.w,H=data.canvas.h;
  const bg=document.createElementNS(NS,'image');
  bg.setAttribute('href',SVG_BG+(SVG_BG.includes('?')?'&':'?')+'v='+Date.now());
  bg.setAttribute('x',0);bg.setAttribute('y',0);bg.setAttribute('width',W);bg.setAttribute('height',H);
  bg.addEventListener('error',()=>err(`Could not load ${SVG_BG} — pass ?svg=YourExport.svg`));
  map.appendChild(bg);

  const gRegions=document.createElementNS(NS,'g');
  const gStl=document.createElementNS(NS,'g');
  map.append(gRegions,gStl);

  const TINT={delta_coast:'var(--coast)',amplified_range:'var(--range)',slide_foothills:'var(--foothills)',
              heartland:'var(--heart)',river_port:'var(--port)',quiet_woods:'var(--woods)',outer_isles:'var(--isles)'};
  const S=new Map(data.settlements.map(s=>[s.name,s]));
  let LBL={regions:{},islands:{},waters:{}};
  try{ LBL=await (await fetch('labels.json',{cache:'no-store'})).json(); }catch(e){}
  // pins.json is position truth - render it live, don't wait for the rebuild bot
  let PINFILE={};
  try{ PINFILE=await (await fetch('pins.json',{cache:'no-store'})).json(); }catch(e){}
  for(const st of data.settlements){
    const p=PINFILE[st.name];
    if(p) st.xy=[+p[0],+p[1]];
  }

  data.regions.forEach(r=>{
    if(/<br\s*\/?>/i.test(r.label)){
      r.label_lines=r.label.split(/<br\s*\/?>/i).map(x=>x.trim());
      r.label=r.label_lines.join(' ');
    }
  });
  const RLABEL=Object.fromEntries(data.regions.map(r=>[r.id,r.label]));

  // regions: padded hulls + ghost labels
  for(const r of data.regions){
    if(!r.hull)continue;
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d','M'+r.hull.map(pt=>pt.join(',')).join(' L')+' Z');
    p.setAttribute('class','region-hull');
    p.style.setProperty('--tint',TINT[r.id]||'var(--ink)');
    gRegions.appendChild(p);
    const t=document.createElementNS(NS,'text');
    const lr=(LBL.regions||{})[r.id]||{};
    const lx=(lr.xy||r.label_xy||r.anchor);
    if(lr.lines) r.label_lines=lr.lines;
    if(lr.size) r.label_size=lr.size;
    t.setAttribute('x',lx[0]); t.setAttribute('y',lx[1]);
    t.setAttribute('class','region-label');
    t.dataset.rid=r.id;
    t.setAttribute('font-size',r.label_size||Math.max(13,Math.min(22,r.rx/9)));
    if(r.label_lines&&r.label_lines.length>1){
      t.textContent='';
      r.label_lines.forEach((ln,i)=>{
        const ts=document.createElementNS(NS,'tspan');
        ts.setAttribute('x',lx[0]);
        ts.setAttribute('dy',i===0?`${-(r.label_lines.length-1)*0.55}em`:'1.08em');
        ts.textContent=ln;t.appendChild(ts);
      });
    }
    t.style.setProperty('--tint',TINT[r.id]||'var(--ink)');
    if(!(r.label_lines&&r.label_lines.length>1)) t.textContent=r.label;
    gRegions.appendChild(t);
  }

  // the compass rose settles on the unnamed northwest island
  // clef needle over an engraved star, ringed by a circular five-line staff
  // Wrapped in an SVG <a> (#rose-home) so the rose itself is the map's way back
  // to the site (issue #359). #rose no longer sets pointer-events:none (#363) -
  // that was blocking hit-testing on every child, so the rose was unclickable.
  const rose=document.createElementNS(NS,'a');
  rose.setAttribute('id','rose-home');
  rose.setAttributeNS('http://www.w3.org/1999/xlink','href','../../index.html');
  rose.setAttribute('href','../../index.html');
  rose.setAttribute('aria-label','Back to live-shows');
  const roseInner=document.createElementNS(NS,'g');
  roseInner.setAttribute('id','rose');
  roseInner.setAttribute('transform','translate(70,82) scale(0.42)');
  roseInner.innerHTML=`<title>Back to live-shows</title>
    <g fill="none" stroke="#221A12">
      <circle r="47" stroke-width=".8"/><circle r="44.5" stroke-width=".8"/><circle r="42" stroke-width=".8"/>
      <circle r="39.5" stroke-width=".8"/><circle r="37" stroke-width=".8"/>
    </g>
    <g fill="#221A12">
      <circle cx="30" cy="-27" r="2.2"/><circle cx="40" cy="9" r="2.2"/><circle cx="12" cy="41" r="2.2"/>
      <circle cx="-26" cy="32" r="2.2"/><circle cx="-41" cy="-6" r="2.2"/><circle cx="-17" cy="-39" r="2.2"/>
    </g>
    <g id="rose-card"><path d="M0 -52 L7 -10 L0 0 Z" fill="#EDE0C2" stroke="#221A12" stroke-width="1.4"/>
      <path d="M0 -52 L-7 -10 L0 0 Z" fill="#221A12"/></g>
    <use href="#rose-card" transform="rotate(90)"/><use href="#rose-card" transform="rotate(180)"/>
    <use href="#rose-card" transform="rotate(270)"/>
    <g id="rose-inter"><path d="M0 -34 L4.5 -8 L0 0 Z" fill="#C9962E" stroke="#221A12" stroke-width="1"/>
      <path d="M0 -34 L-4.5 -8 L0 0 Z" fill="#8a5a2a" stroke="#221A12" stroke-width="1"/></g>
    <use href="#rose-inter" transform="rotate(45)"/><use href="#rose-inter" transform="rotate(135)"/>
    <use href="#rose-inter" transform="rotate(225)"/><use href="#rose-inter" transform="rotate(315)"/>
    <path id="rose-clef" d="M 0 -46 C 10 -40 10 -28 1 -22 C -10 -15 -12 -2 0 4 C 9 8 14 0 9 -6 C 5 -11 -2 -9 -2 -3 M 1 -22 L 3 26 C 3 34 -6 37 -9 31"
      fill="none" stroke="#A63D2F" stroke-width="3" stroke-linecap="round"/>
    <use href="#rose-clef" fill="none" stroke="#221A12" stroke-width="1" stroke-linecap="round"/>
    <image href="../../static/brand-hat.png" x="-15" y="-13" width="30" height="25"
      onerror="this.style.display='none'"/>
    <g font-family="Special Elite" font-size="13" fill="#221A12" text-anchor="middle"
       style="paint-order:stroke;stroke:rgba(237,224,194,.85);stroke-width:3px;">
      <text x="0" y="-57">N</text><text x="62" y="5">E</text><text x="0" y="70">S</text><text x="-62" y="5">W</text>
    </g>`;
  rose.appendChild(roseInner);
  map.appendChild(rose);

  // geo names: islands and waters
  const gGeo=document.createElementNS(NS,'g');
  map.appendChild(gGeo);
  const ISLES_SRC = Object.keys(LBL.islands||{}).length
    ? Object.entries(LBL.islands).map(([name,xy])=>({name,xy}))
    : (data.island_labels||[]);
  const WATER_SRC = Object.keys(LBL.waters||{}).length
    ? Object.entries(LBL.waters).map(([name,xy])=>({name,xy}))
    : (data.water_labels||[]);
  for(const il of ISLES_SRC){
    const t=document.createElementNS(NS,'text');
    t.setAttribute('class','geo-island');t.setAttribute('font-size',7);
    t.dataset.gname=il.name;t.dataset.gkind='island';
    t.setAttribute('text-anchor','middle');
    t.setAttribute('x',il.xy[0]);t.setAttribute('y',il.xy[1]);
    t.textContent=il.name;gGeo.appendChild(t);
  }
  for(const wl of WATER_SRC){
    const t=document.createElementNS(NS,'text');
    t.setAttribute('class','geo-water');t.setAttribute('font-size',6.5);
    t.dataset.gname=wl.name;t.dataset.gkind='water';
    t.setAttribute('text-anchor','middle');
    t.setAttribute('x',wl.xy[0]);t.setAttribute('y',wl.xy[1]);
    t.textContent=wl.name;gGeo.appendChild(t);
  }

  // settlements, small first so capitals sit on top
  const order=['waystation','hamlet','village','town','city','capital'];
  const R={capital:5.2,city:4,town:3,village:2.2,hamlet:1.6,waystation:1.7};
  const readout=document.getElementById('readout');
  for(const s of [...data.settlements].sort((x,y)=>order.indexOf(x.size)-order.indexOf(y.size))){
    const g=document.createElementNS(NS,'g');
    const flags=Object.keys(s.flags||{}).join(' ');
    g.setAttribute('class',`stl ${s.size} ${flags}`);
    g.dataset.name=s.name;
    g.setAttribute('transform',`translate(${s.xy[0]},${s.xy[1]})`);
    g.style.setProperty('--tint',TINT[s.region]||'var(--ink)');
    const r=R[s.size]||2;
    const dot=document.createElementNS(NS,'circle');
    dot.setAttribute('class','dot');dot.setAttribute('r',r);dot.setAttribute('stroke-width',.8);
    g.appendChild(dot);
    if(s.flags&&s.flags.unplaced){
      const halo=document.createElementNS(NS,'circle');
      halo.setAttribute('class','halo');halo.setAttribute('r',r+3.4);
      g.appendChild(halo);
    }
    if(s.flags&&s.flags.legacy){
      const tk=document.createElementNS(NS,'path');
      const rr=R[s.size]||2;
      tk.setAttribute('class','tick');
      tk.setAttribute('d',`M 0 ${-(rr+6.5)} L 2.6 ${-(rr+2.2)} L -2.6 ${-(rr+2.2)} Z`);
      g.appendChild(tk);
    }
    if(s.flags&&s.flags.harbormistress){
      const am=document.createElementNS(NS,'text');
      am.setAttribute('class','anchor-mark');am.setAttribute('x',-(r+6.5));am.setAttribute('y',3);
      am.textContent='\u2693';g.appendChild(am);
    }
    if(s.size==='capital'){
      const ring=document.createElementNS(NS,'circle');
      ring.setAttribute('class','ring');ring.setAttribute('r',r+2.4);
      g.appendChild(ring);
    }
    if(s.size==='capital'||s.size==='city'){
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',r+3);t.setAttribute('y',3);
      t.setAttribute('font-size',s.size==='capital'?9:7);
      t.textContent=s.name;g.appendChild(t);
    }
    g.addEventListener('mouseenter',()=>{
      readout.classList.remove('idle');
      const seen=s.times_seen?`seen ${s.times_seen}\u00d7${s.vip?` \u00b7 VIP ${s.vip}`:''}`:'never seen \u2014 a rumor on the map';
      readout.innerHTML=`<div class="name">${s.name}</div>
        <div class="where">${RLABEL[s.region]||s.region} \u2014 ${s.size}</div>
        <div class="stats">${seen}<br>${s.tier||''} ${flags?'\u00b7 '+flags:''}${s.src?`<br><span style="font-family:'Special Elite';font-size:10.5px;opacity:.8">${s.src}</span>`:''}</div>`;
    });
    gStl.appendChild(g);
  }

  // toggles: regions / unvisited / names / geo names
  const show=(nodes,on)=>nodes.forEach(n=>n.style.display=on?'':'none');
  document.querySelectorAll('#legend input[data-t]').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const t=cb.dataset.t,on=cb.checked;
      if(t==='labels')       show([...gStl.querySelectorAll('text')],on);
      else if(t==='waystation') show([...gStl.querySelectorAll('.stl.unvisited')],on);
      else if(t==='geo') gGeo.style.display=on?'':'none';
      else if(t==='regions') gRegions.style.display=on?'':'none';
    });
  });

  // finder: type-along lookup lights up and labels matches, recenters on the first
  const finder=document.getElementById('finder'),findmsg=document.getElementById('findmsg');
  const fold=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  let foundEls=[];
  function clearFound(){
    foundEls.forEach(g=>{g.classList.remove('found');
      g.querySelectorAll('.foundring,.foundlabel').forEach(e=>e.remove());});
    foundEls=[];
  }
  finder.addEventListener('input',()=>{
    clearFound();
    const q=fold(finder.value.trim());
    if(q.length<2){findmsg.textContent='';return;}
    const hits=[...gStl.querySelectorAll('.stl')].filter(g=>fold(g.dataset.name||'').includes(q));
    findmsg.textContent=hits.length?`${hits.length} match${hits.length>1?'es':''}`:'no match';
    hits.slice(0,12).forEach(g=>{
      g.classList.add('found');foundEls.push(g);
      const ring=document.createElementNS(NS,'circle');
      ring.setAttribute('class','foundring');ring.setAttribute('r',9);
      g.insertBefore(ring,g.firstChild);
      if(!g.querySelector('text:not(.anchor-mark)')){
        const t=document.createElementNS(NS,'text');
        t.setAttribute('class','foundlabel');t.setAttribute('x',7);t.setAttribute('y',3);
        t.setAttribute('font-size',7);t.textContent=g.dataset.name;g.appendChild(t);
      }
    });
    if(hits.length){
      const m=/translate\(([-\d.]+),([-\d.]+)\)/.exec(hits[0].getAttribute('transform'));
      if(m){vb.x=+m[1]-vb.w/2;vb.y=+m[2]-vb.h/2;apply();}
    }
  });

  // apply initial legend state
  document.querySelectorAll('#legend input[data-t]').forEach(cb=>cb.dispatchEvent(new Event('change')));

  // zoom: wheel-to-cursor, buttons, fit; drag to pan — one viewBox for all layers
  let vb={x:0,y:0,w:W,h:H};
  const apply=()=>map.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  function zoomAt(px,py,k){
    vb={x:px-(px-vb.x)*k,y:py-(py-vb.y)*k,w:vb.w*k,h:vb.h*k};apply();
  }
  const stage=document.getElementById('stage');
  stage.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=map.getBoundingClientRect();
    zoomAt(vb.x+(e.clientX-r.left)/r.width*vb.w, vb.y+(e.clientY-r.top)/r.height*vb.h,
           e.deltaY<0?0.85:1/0.85);
  },{passive:false});
  document.getElementById('zin').onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,0.75);
  document.getElementById('zout').onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1/0.75);
  document.getElementById('zfit').onclick=()=>{vb={x:0,y:0,w:W,h:H};apply();};
  // saves are cumulative: seed this session from the committed files
  const pins={}, editCb=window.editCb=document.getElementById('editMode'), expBtn=document.getElementById('exportPins');
  if(authed){
  try{ const ptxt=await (await fetch('pins.json',{cache:'no-store'})).text();
       Object.assign(pins, JSON.parse(ptxt));
       expBtn.textContent=`save pins (${Object.keys(pins).length})`;
       // freshness check: does the rendered data know about this pins file?
       if(data.meta&&data.meta.pins_hash){
         const buf=await crypto.subtle.digest('MD5'in crypto?'MD5':'SHA-1',new TextEncoder().encode(ptxt)).catch(()=>null);
       }
       const stalePins=Object.entries(pins).filter(([n,p])=>{
         const st=S.get(n);return st&&(Math.abs(st.xy[0]-p[0])>=0.5||Math.abs(st.xy[1]-p[1])>=0.5);}).length;
       if(stalePins>8){const e=document.getElementById('err');e.style.display='block';
         e.textContent=`${stalePins} pins are not reflected in fantasy_map_data.json — rerun build_fantasy_map.py and recommit the JSON.`;}
  }catch(e){}
  editCb.addEventListener('change',()=>{expBtn.style.display=editCb.checked?'inline-block':'none';editctl.style.display=editCb.checked?'block':'none';document.body.classList.toggle('editing',editCb.checked);});
  expBtn.addEventListener('click',async()=>{
    setInd('ind-pins','pending');
    expBtn.disabled=true;
    try{
      await ghCommitJson('tools/map/pins.json',pins,'map: update pins ('+Object.keys(pins).length+') via in-page editor');
      setInd('ind-pins','ok');
      expBtn.textContent=`save pins (${Object.keys(pins).length})`;
    }catch(e){ console.error(e); setInd('ind-pins','err',e.message); }
    expBtn.disabled=false;
  });
  }
  const overrides={};
  const editctl=document.getElementById('editctl'),
        ovRegion=document.getElementById('ovRegion'), ovSize=document.getElementById('ovSize'),
        exportOv=document.getElementById('exportOv'), editwho=document.getElementById('editwho');
  if(authed){
  try{ Object.assign(overrides, await (await fetch('map_overrides.json',{cache:'no-store'})).json()); }catch(e){}
  ovRegion.innerHTML=data.regions.map(r=>`<option value="${r.id}">${r.label}</option>`).join('');
  }
  let selected=null;
  function selectStl(g){
    selected=g;
    const st=S.get(g.dataset.name);
    editwho.textContent=g.dataset.name;
    ovRegion.value=(overrides[g.dataset.name]&&overrides[g.dataset.name].region)||st.region;
    ovSize.value=(overrides[g.dataset.name]&&overrides[g.dataset.name].size)||st.size;
  }
  function markOv(name,key,val){
    (overrides[name]??={})[key]=val;
    exportOv.textContent=`save overrides (${Object.keys(overrides).length})`;
  }
  if(authed){
  exportOv.textContent=`save overrides (${Object.keys(overrides).length})`;
  ovRegion.addEventListener('change',()=>{
    if(!selected)return;
    markOv(selected.dataset.name,'region',ovRegion.value);
    selected.style.setProperty('--tint',TINT[ovRegion.value]||'var(--ink)');
  });
  ovSize.addEventListener('change',()=>{
    if(!selected)return;
    const name=selected.dataset.name, sz=ovSize.value;
    markOv(name,'size',sz);
    ['capital','city','town','village','hamlet','waystation'].forEach(c=>selected.classList.remove(c));
    selected.classList.add(sz);
    selected.querySelector('.dot').setAttribute('r',{capital:5.2,city:4,town:3,village:2.2,hamlet:1.6,waystation:1.7}[sz]||2);
  });
  exportOv.addEventListener('click',async()=>{
    setInd('ind-ov','pending');
    exportOv.disabled=true;
    try{
      await ghCommitJson('tools/map/map_overrides.json',overrides,'map: update overrides ('+Object.keys(overrides).length+') via in-page editor');
      setInd('ind-ov','ok');
      exportOv.textContent=`save overrides (${Object.keys(overrides).length})`;
    }catch(e){ console.error(e); setInd('ind-ov','err',e.message); }
    exportOv.disabled=false;
  });
  }
  // waterway tracing: a full-takeover mode - no other edits while tracing
  let TRACES=[];
  const traceCb=document.getElementById('traceMode');
  const traceBtn=document.getElementById('traceBtn'), traceExp=document.getElementById('traceExp'),
        traceMsg=document.getElementById('traceMsg'), traceName=document.getElementById('traceName');
  const gTrace=document.createElementNS(NS,'g'); map.appendChild(gTrace);
  if(authed){
  try{ TRACES=await (await fetch('traced_waterways.json',{cache:'no-store'})).json(); }catch(e){}
  }
  let tracing=null, unsaved=0, pendingName=null;
  const traceCount=()=>{traceExp.textContent=`save waterways (${TRACES.length})`+(unsaved?` \u2014 ${unsaved} UNSAVED`:'');};
  if(authed){
  traceCount();
  }
  function segd(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],L2=vx*vx+vy*vy||1e-9;
    const t=Math.max(0,Math.min(1,((p[0]-a[0])*vx+(p[1]-a[1])*vy)/L2));
    return Math.hypot(p[0]-(a[0]+t*vx),p[1]-(a[1]+t*vy));}
  function tubeCapture(tr){
    const pts=tr.points; if(pts.length<2)return[];
    const listed=new Set(tr.settlements), caps=[];
    for(const st of data.settlements){
      if(st.region==='outer_isles'||listed.has(st.name))continue;
      let dd=1e9;
      for(let i=0;i<pts.length-1;i++)dd=Math.min(dd,segd(st.xy,pts[i],pts[i+1]));
      if(dd<=10)caps.push(st.name);
    }
    return caps;
  }
  function doneNames(){
    const done=new Set();
    for(const t of TRACES){
      (t.settlements||[]).forEach(n=>done.add(n));
      (t.captured||[]).forEach(c=>done.add(c.name||c));
    }
    return done;
  }
  function paintDone(){
    const done=doneNames();
    gStl.querySelectorAll('.stl').forEach(g=>g.classList.toggle('tracedone',done.has(g.dataset.name)));
  }
  if(authed){
  traceCb.addEventListener('change',()=>{
    const on=traceCb.checked;
    document.body.classList.toggle('tracing',on);
    if(on){
      if(editCb.checked){editCb.checked=false;editCb.dispatchEvent(new Event('change'));}
      editCb.disabled=true;
      paintDone();
      traceMsg.textContent=`${doneNames().size} settlements already traced \u2014 pink = still to do`;
    }else{
      editCb.disabled=false;
      if(tracing)endTrace(true);
      gStl.querySelectorAll('.stl.tracedone').forEach(g=>g.classList.remove('tracedone'));
      traceMsg.textContent='';
    }
  });
  }
  function redrawTrace(){
    gTrace.replaceChildren();
    if(tracing&&tracing.points.length>1){
      const p=document.createElementNS(NS,'path');
      p.setAttribute('class','tracepath');
      p.setAttribute('d','M '+tracing.points.map(q=>q.join(' ')).join(' L '));
      gTrace.appendChild(p);
    }
    document.querySelectorAll('.stl.traced').forEach(g=>{
      g.classList.remove('traced');
      g.querySelectorAll('.traceno,.clicklabel').forEach(t=>t.remove());
    });
    if(!tracing)return;
    tracing.settlements.forEach((n,i)=>{
      const g=[...gStl.querySelectorAll('.stl')].find(x=>x.dataset.name===n);
      if(!g)return;
      g.classList.add('traced');
      const st=S.get(n);
      const no=document.createElementNS(NS,'text');
      no.setAttribute('class','traceno');no.setAttribute('x',-(R[st.size]||2)-5);no.setAttribute('y',-3);
      no.textContent=i+1;g.appendChild(no);
      const lb=document.createElementNS(NS,'text');
      lb.setAttribute('class','clicklabel');lb.setAttribute('x',(R[st.size]||2)+2.5);lb.setAttribute('y',2.5);
      lb.textContent=n;g.appendChild(lb);
    });
  }
  function toggleMember(g){
    const n=g.dataset.name, st=S.get(n); if(!st)return;
    const i=tracing.settlements.indexOf(n);
    if(i>=0){tracing.settlements.splice(i,1);tracing.points.splice(i,1);}
    else{tracing.settlements.push(n);tracing.points.push([+st.xy[0].toFixed(1),+st.xy[1].toFixed(1)]);}
    redrawTrace();
    traceMsg.textContent=`${tracing.id}: ${tracing.settlements.length} tagged`;
  }
  function endTrace(silent){
    if(tracing&&tracing.settlements.length>=2){
      tracing.captured=tubeCapture(tracing);
      TRACES.push(tracing);unsaved++;
      pendingName=tracing;
      if(!silent){
        traceName.style.display='block';traceName.value='';traceName.focus();
        traceMsg.textContent=`${tracing.id} saved: ${tracing.settlements.length} tagged + ${tracing.captured.length} captured \u2014 name it, then SAVE`;
      }
      paintDone();
    } else if(tracing&&!silent){ traceMsg.textContent='trace discarded (needs 2+)'; }
    tracing=null;redrawTrace();
    traceBtn.textContent='trace waterway';traceCount();
    if(unsaved>=2)traceMsg.textContent+=` \u26a0 ${unsaved} traces unsaved \u2014 save now`;
  }
  if(authed){
  traceName.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&pendingName){
      pendingName.name=traceName.value.trim()||null;
      traceName.style.display='none';pendingName=null;
      traceMsg.textContent='named \u2014 remember to save';
    }
  });
  traceBtn.addEventListener('click',()=>{
    if(!traceCb.checked){traceCb.checked=true;traceCb.dispatchEvent(new Event('change'));}
    if(tracing){endTrace();return;}
    tracing={id:`wway-${TRACES.length+1}`,name:null,settlements:[],points:[],captured:[]};
    traceBtn.textContent='end trace';
    traceMsg.textContent=`${tracing.id}: click settlements source \u2192 mouth (click again to remove)`;
  });
  traceExp.addEventListener('click',async()=>{
    if(tracing)endTrace();
    setInd('ind-trace','pending');
    traceExp.disabled=true;
    try{
      await ghCommitJson('tools/map/traced_waterways.json',TRACES,'map: update traced waterways ('+TRACES.length+') via in-page editor');
      setInd('ind-trace','ok');
      unsaved=0;traceCount();
    }catch(e){ console.error(e); setInd('ind-trace','err',e.message); }
    traceExp.disabled=false;
  });
  window.addEventListener('beforeunload',e=>{
    if(unsaved>0){e.preventDefault();e.returnValue='';}
  });
  const lblBtn=document.getElementById('exportLbl')||document.createElement('button');
  lblBtn.addEventListener('click',async()=>{
    setInd('ind-lbl','pending');
    lblBtn.disabled=true;
    try{
      await ghCommitJson('tools/map/labels.json',LBL,'map: update labels via in-page editor');
      setInd('ind-lbl','ok');
      lblBtn.textContent='save labels';
    }catch(e){ console.error(e); setInd('ind-lbl','err',e.message); }
    lblBtn.disabled=false;
  });
  }
  let pan=null, dragS=null;
  const toMap=(cx,cy)=>{const r=map.getBoundingClientRect();
    return [vb.x+(cx-r.left)/r.width*vb.w, vb.y+(cy-r.top)/r.height*vb.h];};
  let dragL=null, downAt=null;
  stage.addEventListener('pointerdown',e=>{
    if(e.target.closest('#rose-home')){return;}  // let the anchor's native click/nav fire uncaptured (#363 follow-up)
    downAt=[e.clientX,e.clientY];
    const rl=(authed&&window.editCb&&editCb.checked)?e.target.closest('.region-label,.geo-island,.geo-water'):null;
    const g=(authed&&window.editCb&&editCb.checked&&!rl)?e.target.closest('.stl'):null;
    stage.setPointerCapture(e.pointerId);
    if(rl){dragL=rl;e.preventDefault();return;}
    if(g&&tracing){traceAdd(g);e.preventDefault();return;}
    if(g){dragS={g,name:g.dataset.name};selectStl(g);e.preventDefault();return;}
    pan={x:e.clientX,y:e.clientY};stage.classList.add('panning');
  });
  stage.addEventListener('pointermove',e=>{
    if(dragL){
      const [mx,my]=toMap(e.clientX,e.clientY);
      dragL.setAttribute('x',mx.toFixed(0));dragL.setAttribute('y',my.toFixed(0));
      dragL.querySelectorAll('tspan').forEach(ts=>ts.setAttribute('x',mx.toFixed(0)));
      const X=+mx.toFixed(0),Y=+my.toFixed(0);
      if(dragL.dataset.rid) (LBL.regions[dragL.dataset.rid]??={}).xy=[X,Y];
      else if(dragL.dataset.gkind==='island') LBL.islands[dragL.dataset.gname]=[X,Y];
      else LBL.waters[dragL.dataset.gname]=[X,Y];
      lblBtn.textContent='save labels *';
      readout.innerHTML=`<div class="nm">${dragL.dataset.rid||dragL.dataset.gname}</div><div class="stats">(${X}, ${Y}) \u2014 in labels.json</div>`;
      return;
    }
    if(dragS){
      const [mx,my]=toMap(e.clientX,e.clientY);
      dragS.g.setAttribute('transform',`translate(${mx.toFixed(1)},${my.toFixed(1)})`);
      if(dragS.name){pins[dragS.name]=[+mx.toFixed(1),+my.toFixed(1)];
        expBtn.textContent=`save pins (${Object.keys(pins).length})`;}
      return;
    }
    if(!pan)return;
    const r=map.getBoundingClientRect();
    vb.x-=(e.clientX-pan.x)/r.width*vb.w;vb.y-=(e.clientY-pan.y)/r.height*vb.h;
    pan={x:e.clientX,y:e.clientY};apply();
  });
  stage.addEventListener('pointerup',e=>{
    // click (not drag) in view mode toggles a settlement label
    if(!dragS&&!dragL&&downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])<4
       &&!(authed&&window.editCb&&editCb.checked)){
      const g=e.target.closest&&e.target.closest('.stl');
      if(g){
        const ex=g.querySelector('.clicklabel');
        if(ex)ex.remove();
        else if(!g.querySelector('text:not(.anchor-mark):not(.clicklabel)')){
          const st=S.get(g.dataset.name);
          const t=document.createElementNS(NS,'text');
          t.setAttribute('class','clicklabel');
          t.setAttribute('x',(R[st.size]||2)+2.5);t.setAttribute('y',2.5);
          t.textContent=g.dataset.name;g.appendChild(t);
        }
      }
    }
    pan=null;dragS=null;dragL=null;downAt=null;stage.classList.remove('panning');
  });
  window.addEventListener('keydown',e=>{
    if(e.key==='Escape')document.querySelectorAll('.clicklabel').forEach(t=>t.remove());
  });
  apply();

  // the plate drags by its title bar
  const plate=document.getElementById('plate'),grip=document.getElementById('plateGrip');
  let pd=null;
  grip.addEventListener('pointerdown',e=>{
    const b=plate.getBoundingClientRect();
    plate.style.top=b.top+'px';plate.style.left=b.left+'px';plate.style.transform='none';
    pd={dx:e.clientX-b.left,dy:e.clientY-b.top};grip.setPointerCapture(e.pointerId);e.preventDefault();
  });
  grip.addEventListener('pointermove',e=>{
    if(!pd)return;
    plate.style.left=Math.max(4,Math.min(innerWidth-plate.offsetWidth-4,e.clientX-pd.dx))+'px';
    plate.style.top=Math.max(4,Math.min(innerHeight-plate.offsetHeight-4,e.clientY-pd.dy))+'px';
  });
  grip.addEventListener('pointerup',()=>{pd=null;});

})();
</script>
</body>
</html>
