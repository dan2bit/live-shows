name: Quarterly portrait rot check (spotify_cache)

# Scheduled `--check-image-rot`: HEAD-check every cached portrait URL against
# the public CDN (unauthenticated, unmetered, outside --limit) and re-fetch
# via the metered API only URLs answering 404/410. The whole roster takes
# about a minute; metered calls happen only when rot is actually found.
#
# The cosmetic full-roster sweep (`--refresh-images --stale-days 80`) is
# workflow_dispatch-only via the full_sweep input — portrait drift is
# slow-moving and never worth a scheduled burst.
#
# Commits ride the established bot pattern: deploy key -> staging ->
# auto-promote. data/artist_spotify.json promoting to main cascade-triggers
# artist-modal-index.yml — expected and desired. History: docs/ISSUE_LOG.md.

on:
  schedule:
    - cron: "23 7 3 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      full_sweep:
        description: "Run the cosmetic full-roster portrait sweep instead of the rot check"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-images-quarterly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests python-dotenv
      - name: Rot check (unmetered HEADs; metered re-fetch only on 404/410)
        if: ${{ inputs.full_sweep != true }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 scripts/spotify_cache.py --check-image-rot --limit 40
      - name: Cosmetic full sweep (dispatch-only, budgeted)
        if: ${{ inputs.full_sweep == true }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 scripts/spotify_cache.py --refresh-images --stale-days 80 --limit 90
      - name: Commit to staging if changed
        run: |
          git add data/artist_spotify.json
          if git diff --cached --quiet; then
            echo "data/artist_spotify.json unchanged - nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            git commit -m "ci: quarterly portrait maintenance (spotify_cache)"
            for attempt in 1 2 3 4 5; do
              git fetch promote staging
              git rebase promote/staging || {
                echo "rebase conflict on staging — bailing (not a race, a real conflict)"
                exit 1
              }
              if git push promote HEAD:staging; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
              echo "push rejected on attempt $attempt (staging moved) — retrying after ${attempt}s backoff"
              sleep "$attempt"
            done
            echo "gave up after 5 attempts"
            exit 1
          fi
