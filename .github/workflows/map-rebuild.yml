name: Rebuild fantasy map data

# Closes the pins -> data loop: when the map's inputs change on main
# (pins, overrides, labels, discovered adds, or the two generator scripts),
# regenerate fantasy_map_data.json and heightmap.png and commit them.
#
# main requires the `guard` status check, so this commits to `staging`
# via the promote deploy key (which also makes the staging push trigger
# auto-promote — GITHUB_TOKEN pushes would not). The generated files are
# not watched paths, so promotion back to main does not retrigger this.
# The builder is deterministic (seed 2026 + pinned PYTHONHASHSEED), so
# identical inputs produce byte-identical output and the job no-ops.
#
# The build runs on a checkout of `staging`, not `main`, even though the
# trigger is a push to main. Two runs can queue behind one another (the
# concurrency group serialises, it does not dedupe), and the second used to
# check out main before the first run's output had been promoted to it: it
# then rebuilt the same bytes, saw them as a change against its stale tree,
# and its rebase onto staging conflicted with the copy already there - a
# guaranteed conflict on the PNG, which git cannot merge. staging is the
# branch this job writes to, so building from it means the rebase is a
# no-op unless staging genuinely moves mid-build, which the retry handles.
#
# The heightmap is optional. It does depend on settlement positions (the
# emitter keeps inhabited ground above water and pulls lake shores back
# from anyone standing near them), so every pin save would change it a
# little - but nothing live reads it: the page's background is map.svg, and
# heightmap.png is the input to the occasional FMG repaint. Committing a
# large PNG on every save is repo weight in the one file git cannot merge.
# So the data rebuilds on every input push; the PNG only when the emitter
# itself changed in the push, or on a manual run with heightmap enabled.
# Repaint from a manual run when the terrain is due for it.

on:
  push:
    branches: [main]
    paths:
      - tools/map/pins.json
      - tools/map/map_overrides.json
      - tools/map/labels.json
      - tools/map/traced_waterways.json
      - tools/map/discovered_adds.json
      - tools/map/build_fantasy_map.py
      - tools/map/emit_heightmap.py
  workflow_dispatch:
    inputs:
      heightmap:
        description: "Also regenerate heightmap.png (for an FMG repaint)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: map-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install networkx numpy pillow
      - name: Decide whether the heightmap is due
        id: hm
        env:
          DISPATCH_HM: ${{ github.event_name == 'workflow_dispatch' && inputs.heightmap }}
          PUSH_TOUCHED: ${{ contains(join(github.event.commits.*.modified, ','), 'tools/map/emit_heightmap.py') || contains(join(github.event.commits.*.added, ','), 'tools/map/emit_heightmap.py') }}
        run: |
          if [ "$DISPATCH_HM" = "true" ] || [ "$PUSH_TOUCHED" = "true" ]; then
            echo "heightmap=true"  >> "$GITHUB_OUTPUT"; echo "heightmap: yes"
          else
            echo "heightmap=false" >> "$GITHUB_OUTPUT"; echo "heightmap: no (data only)"
          fi
      - name: Rebuild map data
        run: python3 tools/map/build_fantasy_map.py
      - name: Rebuild heightmap
        if: steps.hm.outputs.heightmap == 'true'
        run: python3 tools/map/emit_heightmap.py
      - name: Commit to staging if changed
        env:
          HEIGHTMAP: ${{ steps.hm.outputs.heightmap }}
        run: |
          git add tools/map/fantasy_map_data.json
          if [ "$HEIGHTMAP" = "true" ]; then git add tools/map/heightmap.png; fi
          if git diff --cached --quiet; then
            echo "map artifacts unchanged - nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            if [ "$HEIGHTMAP" = "true" ]; then
              git commit -m "ci: regenerate fantasy map data + heightmap"
            else
              git commit -m "ci: regenerate fantasy map data"
            fi
            for attempt in 1 2 3 4 5; do
              git fetch promote staging
              git rebase promote/staging || {
                echo "rebase conflict on staging - only this job writes these files and it is serialised, so staging moved under it in a way a retry will not fix"
                exit 1
              }
              if git push promote HEAD:staging; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
              echo "push rejected on attempt $attempt (staging moved) — retrying after ${attempt}s backoff"
              sleep "$attempt"
            done
            echo "gave up after 5 attempts"
            exit 1
          fi
