name: Close photo issue

# main requires the `guard` status check, so the artist-photos.tsv write
# goes to `staging` via the promote deploy key (a GITHUB_TOKEN push to staging
# would NOT trigger auto-promote). No [skip ci]: auto-promote must run to
# fast-forward main. Triggered by a comment carrying the image-server share link
# on a "Photo:" issue. The script also mirrors the share link into the
# matching live_shows_current.tsv row's Photo URL, so both files ride one commit.
#
# Forkers: PHOTO_HOST below is this fork's image server. It is deliberately not
# read from config.yaml — a workflow that parsed config to decide what to trust
# would let a config edit widen what the automation accepts. Change it here.

on:
  issue_comment:
    types: [created]

concurrency:
  group: close-photo-issue
  cancel-in-progress: false

env:
  PHOTO_HOST: photos.redhat-bootlegs.net

jobs:
  close-photo:
    # Only run when:
    # 1. The comment is on an issue (not a PR)
    # 2. The issue title starts with "Photo:"
    # 3. The comment carries an image-server share link, OR a retired Google
    #    Photos link in either form. Firing on the retired forms lets the job
    #    say the host moved instead of silently doing nothing — the library was
    #    migrated and a Google link would write a row pointing at the old home.
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, 'Photo:') &&
      (contains(github.event.comment.body, 'photos.redhat-bootlegs.net/share') ||
       contains(github.event.comment.body, 'photos.google.com/share') ||
       contains(github.event.comment.body, 'photos.app.goo.gl/'))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract share link from comment
        id: extract
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PHOTO_HOST: ${{ env.PHOTO_HOST }}
        run: |
          python3 - << 'PYEOF'
          import re, os, sys

          comment = os.environ["COMMENT_BODY"]
          host = os.environ["PHOTO_HOST"]
          out = os.environ["GITHUB_OUTPUT"]

          # An image-server share link is what the appender needs. A Google
          # Photos link in either form is retired: the library was migrated and
          # every photo link now points at the image server, so writing a Google
          # link would reintroduce the old host one row at a time. Report it
          # rather than accepting it.
          pattern = r'https?://' + re.escape(host) + r'/share/\S+'
          m = re.search(pattern, comment)
          if m:
              link = m.group(0).rstrip('.,)>]')
              with open(out, "a") as f:
                  f.write("mode=ok\n")
                  f.write(f"share_link={link}\n")
              print(f"share_link={link}")
          elif re.search(r'https?://photos\.(google\.com/share|app\.goo\.gl)/\S+', comment):
              with open(out, "a") as f:
                  f.write("mode=legacy\n")
              print("retired Google Photos link found - asking for an image-server link")
          else:
              print(f"ERROR: no {host} share link found in comment", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Ask for an image-server link
        if: steps.extract.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body 'That is a Google Photos link, which the photo automation no longer accepts. The photo library was migrated to the image server and every link in it now points there, so a Google link would reintroduce the old host. Upload the still to Immich, use **Share -> Create link**, and paste the resulting `https://'"$PHOTO_HOST"'/share/...` URL here.'

      - name: Append row to artist-photos.tsv + mirror Photo URL to show row
        id: append
        if: steps.extract.outputs.mode == 'ok'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          SHARE_LINK: ${{ steps.extract.outputs.share_link }}
        run: |
          python scripts/close_photo_issue.py "$ISSUE_TITLE" "$SHARE_LINK"

      - name: Commit updated TSVs to staging
        if: steps.extract.outputs.mode == 'ok'
        run: |
          git add data/show_goals/artist-photos.tsv data/live_shows_current.tsv
          if git diff --cached --quiet; then
            echo "No TSV changes - nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            git commit -m "photo: row added from issue #${{ github.event.issue.number }}"
            git fetch promote staging
            git rebase promote/staging
            git push promote HEAD:staging
          fi

      - name: Close the issue
        if: steps.extract.outputs.mode == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALBUM_NOTE: ${{ steps.append.outputs.album_note }}
        run: |
          BODY="Photo row written to artist-photos.tsv automatically."
          if [ -n "$ALBUM_NOTE" ]; then
            BODY="$BODY"$'\n\n'"$ALBUM_NOTE"
          fi
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --comment "$BODY"
