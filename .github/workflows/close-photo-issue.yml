name: Close photo issue

# main requires the `guard` status check, so the library writes go to
# `staging` via the promote deploy key (a GITHUB_TOKEN push to staging would
# NOT trigger auto-promote). No [skip ci]: auto-promote must run to
# fast-forward main.
#
# Triggered by a comment on a "Photos:" issue (one issue per show) that
# BEGINS with a photo's own image-server share link, optionally followed by
# tokens: artist="..." subtype=LEAF signed detail close. The handler resolves
# the link to its asset, takes the kind from the upload album the photo sits
# in, tags it, files it in the show album, the artist album and the kind
# album (creating any that are missing, minting one share link per album
# only where none exists), writes the show-album link to the show row and
# the artist-album link to artist-albums.tsv, commits, and replies with the
# links. The issue closes only when the comment carries `close`.
#
# Trust boundary, in order of importance:
#   1. Only the repository owner's comments fire the job. The handler holds an
#      image-server key; a stranger's comment must not be able to spend it.
#   2. The comment must START with the link. A link mentioned mid-sentence
#      (an example, a quote of an earlier comment) does not fire, which is
#      the failure that put a placeholder row in the library once.
#   3. PHOTO_HOST is fixed here, not read from config.yaml - a workflow that
#      parsed config to decide what to trust would let a config edit widen
#      what the automation accepts. Forkers: change it here.
#
# IMMICH_API_KEY is the least-privilege "photo close (CI)" key described in
# tools/playbooks/IMAGE_SERVER.md: it can read, tag, create albums and mint
# links, and can never upload, modify or delete a photo.

on:
  issue_comment:
    types: [created]

concurrency:
  group: close-photo-issue
  cancel-in-progress: false

env:
  PHOTO_HOST: photos.redhat-bootlegs.net

jobs:
  close-photo:
    if: |
      github.event.issue.pull_request == null &&
      (startsWith(github.event.issue.title, 'Photo:') || startsWith(github.event.issue.title, 'Photos:')) &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'https://photos.redhat-bootlegs.net/share/')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Take the first line of the comment
        id: extract
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - << 'PYEOF'
          import os
          line = os.environ["COMMENT_BODY"].strip().split("\n", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"line={line}\n")
          print(f"line={line}")
          PYEOF

      - name: File the photo (tags, albums, links) and write the library rows
        id: file
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_LINE: ${{ steps.extract.outputs.line }}
          IMMICH_API_KEY: ${{ secrets.IMMICH_API_KEY }}
        run: |
          if [ -z "$IMMICH_API_KEY" ]; then
            echo "ERROR: IMMICH_API_KEY secret is not set - see tools/playbooks/IMAGE_SERVER.md" >&2
            exit 1
          fi
          python scripts/close_photo_issue.py "$ISSUE_TITLE" "$COMMENT_LINE"

      - name: Commit updated TSVs to staging
        run: |
          git add data/live_shows_current.tsv data/history/*.tsv data/show_goals/artist-albums.tsv
          if git diff --cached --quiet; then
            echo "No TSV changes - nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            git commit -m "photo: filed from issue #${{ github.event.issue.number }}"
            git fetch promote staging
            git rebase promote/staging
            git push promote HEAD:staging
          fi

      - name: Reply with the links, and close on request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ steps.file.outputs.kind }}
          SHOW_LINK: ${{ steps.file.outputs.show_link }}
          ARTIST: ${{ steps.file.outputs.artist }}
          ARTIST_LINK: ${{ steps.file.outputs.artist_link }}
          CLOSE: ${{ steps.file.outputs.close }}
        run: |
          BODY="Filed ($KIND)."$'\n\n'"Show album: $SHOW_LINK"
          if [ -n "$ARTIST" ]; then
            BODY="$BODY"$'\n'"Artist album ($ARTIST): $ARTIST_LINK"
          fi
          if [ "$CLOSE" = "true" ]; then
            gh issue close ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --comment "$BODY"
          else
            gh issue comment ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --body "$BODY"
          fi
