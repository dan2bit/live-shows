name: Close photo issue

# main requires the `guard` status check, so the artist-photos.tsv write
# goes to `staging` via the promote deploy key (a GITHUB_TOKEN push to staging
# would NOT trigger auto-promote). No [skip ci]: auto-promote must run to
# fast-forward main. Triggered by a comment carrying the Google Photos share link
# on a "Photo:" issue. The script also mirrors the share link into the
# matching live_shows_current.tsv row's Photo URL, so both files ride one commit.

on:
  issue_comment:
    types: [created]

concurrency:
  group: close-photo-issue
  cancel-in-progress: false

jobs:
  close-photo:
    # Only run when:
    # 1. The comment is on an issue (not a PR)
    # 2. The issue title starts with "Photo:"
    # 3. The comment carries a Google Photos share link OR a photos.app.goo.gl
    #    short link (the Share -> Create Link output). The short link cannot be
    #    consumed directly, but firing on it lets the job ask for the resolved
    #    form instead of silently doing nothing.
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, 'Photo:') &&
      (contains(github.event.comment.body, 'photos.google.com/share') ||
       contains(github.event.comment.body, 'photos.app.goo.gl/'))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract share link from comment
        id: extract
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - << 'PYEOF'
          import re, os, sys

          comment = os.environ["COMMENT_BODY"]
          out = os.environ["GITHUB_OUTPUT"]

          # A resolved long link is what the appender needs. If only a
          # photos.app.goo.gl short link is present (the Share -> Create Link
          # output), ask for the resolved form rather than silently doing
          # nothing: that host matches neither this extractor nor the
          # album-scoped URL the script keys on.
          m = re.search(r'https?://photos\.google\.com/share/\S+', comment)
          if m:
              link = m.group(0).rstrip('.,)>]')
              with open(out, "a") as f:
                  f.write("mode=ok\n")
                  f.write(f"share_link={link}\n")
              print(f"share_link={link}")
          elif re.search(r'https?://photos\.app\.goo\.gl/\S+', comment):
              with open(out, "a") as f:
                  f.write("mode=shortlink\n")
              print("photos.app.goo.gl short link found — asking for the resolved long form")
          else:
              print("ERROR: no Google Photos share link found in comment", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Ask for the resolved share link
        if: steps.extract.outputs.mode == 'shortlink'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body 'That looks like a `photos.app.goo.gl` short link, which the photo automation cannot read (it matches neither the trigger nor the extractor). Open it once and copy where it lands - the `https://photos.google.com/share/...?key=...` URL - then paste that here and it will close the issue.'

      - name: Append row to artist-photos.tsv + mirror Photo URL to show row
        id: append
        if: steps.extract.outputs.mode == 'ok'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          SHARE_LINK: ${{ steps.extract.outputs.share_link }}
        run: |
          python scripts/close_photo_issue.py "$ISSUE_TITLE" "$SHARE_LINK"

      - name: Commit updated TSVs to staging
        if: steps.extract.outputs.mode == 'ok'
        run: |
          git add data/show_goals/artist-photos.tsv data/live_shows_current.tsv
          if git diff --cached --quiet; then
            echo "No TSV changes - nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            git commit -m "photo: row added from issue #${{ github.event.issue.number }}"
            git fetch promote staging
            git rebase promote/staging
            git push promote HEAD:staging
          fi

      - name: Close the issue
        if: steps.extract.outputs.mode == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALBUM_NOTE: ${{ steps.append.outputs.album_note }}
        run: |
          BODY="Photo row written to artist-photos.tsv automatically."
          if [ -n "$ALBUM_NOTE" ]; then
            BODY="$BODY"$'\n\n'"$ALBUM_NOTE"
          fi
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --comment "$BODY"
