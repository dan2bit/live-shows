name: Reconcile photos

# Read-only offline lint of every photo link the library carries (show
# rows in live_shows_current.tsv and data/history/*.tsv, plus the album
# TSVs): MALFORMED or DUPLICATE share keys fail the run; OFF-HOST (a retired
# Google link) is reported but does NOT fail. Whether a key still resolves
# on the server is `show_photos.py audit`, run locally with the key.
# Read-only, no commit. Triggers on main after auto-promote so it sees the
# post-promotion state, like audit-times-seen.yml.

on:
  push:
    branches: [main]
    paths:
      - data/live_shows_current.tsv
      - data/history/**
      - data/show_goals/artist-albums.tsv
      - data/show_goals/kind-albums.tsv
      - scripts/reconcile_photos.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reconcile show Photo URLs against artist-photos.tsv
        run: python3 scripts/reconcile_photos.py
