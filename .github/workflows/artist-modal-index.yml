name: Build artist_modal_index.json

# main requires the `guard` status check, so this commits to `staging`
# via the promote deploy key (which also makes the staging push trigger
# auto-promote — GITHUB_TOKEN pushes would not). No [skip ci]: we WANT
# auto-promote to run. artist_modal_index.json is not a watched path, so promotion
# back to main does not retrigger this workflow.
#
# The build runs on a checkout of `staging`, not the pushed `main` commit, even
# though the trigger is a push to main. Two pushes that land close together
# start two runs; if each built from its own triggering commit, the second
# would rebuild the whole file from a tree that lacks the first run's output
# and then fail to rebase onto it. Building from staging makes that rebase a
# no-op in the ordinary case. If staging does gain its own copy of the output
# while this run is working, the commit step does not give up: it takes the
# new staging tip, runs the generator again there and pushes that.

on:
  push:
    branches: [main]
    paths:
      - config.yaml
      - data/artists.tsv
      - data/fast_track.tsv
      - data/live_shows_current.tsv
      - data/live_shows_potential.tsv
      - data/seen_with.tsv
      - data/history/**
      - data/show_goals/autograph_books_eligibility.tsv
      - data/show_goals/hat_eligibility.tsv
      - data/show_goals/hat_signatures.tsv
      - data/show_goals/book_signatures.tsv
      - data/show_goals/artist-albums.tsv
      - data/artist_spotify.json
      - data/recommend_aliases.tsv
      - data/artist_relations.tsv
      - data/bill_annotations.tsv
      - tools/research/follows/follows_master.tsv
      - scripts/build_artist_index.py
      - scripts/name_forms.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artist-modal-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # One definition of the generator, because the commit step runs it a
      # second time when it has to rebuild on a staging tip that moved.
      GENERATE: python3 scripts/build_artist_index.py
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Generate index
        run: $GENERATE
      - name: Commit to staging if changed
        run: |
          git add data/artist_modal_index.json
          if git diff --cached --quiet; then
            echo "data/artist_modal_index.json unchanged - nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            git commit -m "ci: regenerate artist_modal_index.json"
            for attempt in 1 2 3 4 5; do
              git fetch promote staging
              if ! git rebase promote/staging; then
                # Two full rewrites of a generated file cannot be merged. Drop this
                # run's copy, take staging as it now stands, and rebuild from those
                # inputs - the result is what a later run would have produced anyway.
                echo "rebase conflict on attempt $attempt - staging gained its own copy of the output; rebuilding on the new staging tip"
                git rebase --abort || true
                git reset --hard promote/staging
                $GENERATE
                git add data/artist_modal_index.json
                if git diff --cached --quiet; then
                  echo "staging already carries this output - nothing to commit."
                  exit 0
                fi
                git commit -m "ci: regenerate artist_modal_index.json"
              fi
              if git push promote HEAD:staging; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
              echo "push rejected on attempt $attempt (staging moved) - retrying after ${attempt}s backoff"
              sleep "$attempt"
            done
            echo "gave up after 5 attempts"
            exit 1
          fi
