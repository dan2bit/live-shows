name: Daily release refresh (spotify_cache)

# Daily `--refresh-releases` trickle. Was a four-day month-end burst at
# --limit 90; that concentrated all capacity into a window where one dropped
# cron cost 90 requests, which is exactly what happened on 2026-08-29 and left
# 100 entries stale. Daily at --limit 25 gives ~750 requests/month against a
# ~475-entry roster needing roughly 1.2 refreshes each, so a dropped run costs
# 25 and the next day absorbs it. February is no longer a special case: a
# month-end window gives only three days there regardless of how wide it is.
#
# --stale-days 25 is EXPLICIT AND REQUIRED: the auto-inferrer is tuned for
# short retry gaps and daily runs change what its "recent-band structure"
# heuristic sees. Under a daily cadence it also means most days are a cheap
# no-op — nothing is re-pulled inside 25 days, so the run does nothing until
# entries age past the threshold.
#
# END-OF-MONTH RAMP. A flat 25/day means a full-roster sweep takes roughly two
# weeks, so a "New Music [Month]" list isn't trustworthy until well into the
# following month. What makes it trustworthy is narrow and checkable: every
# resolved entry has a latest_release_checked ON OR AFTER the month's last
# release Friday. A check made before that Friday cannot see that Friday's
# releases, so ramp days earlier than the Friday contribute nothing toward it.
#
# The binding constraint is Spotify's Dev-mode ceiling of roughly 100 calls a
# day for the whole app; going over it is a lockout of about a day that stops
# every Spotify job, not just this one. One check is one call, so a roster of
# 500+ needs five to six days of ramp after the Friday, and no setting in this
# file shortens that. The ramp is therefore a steady daily budget UNDER the
# ceiling, not a burst, and it runs until nothing is pending:
#
#   - Window: opens on the month's last Friday and runs until no entry is
#     pending, with a hard stop on the WINDOW_END_DOM-th of the next month
#     (an entry that keeps failing to stamp would otherwise hold it open).
#     Outside the window the flat trickle runs unchanged.
#   - Eligibility: inside the window, --stale-days is set so exactly the
#     entries checked BEFORE that Friday are eligible (days since the Friday,
#     plus one). Oldest-checked-first ordering then walks the roster once.
#   - Budget: RAMP_CAP a day, less what other jobs on the same Spotify app spend
#     that day - SUNDAY_RESERVE for the weekly new-artist resolve, HEAL_RESERVE
#     for the portrait heal on the 1st - and never more than what is pending.
#     The pending figure comes from --count-pending, which is local and spends
#     no requests, so a dropped or bailed run just leaves more for tomorrow.
#   - RAMP_CAP, SUNDAY_RESERVE and HEAL_RESERVE are the dials. Lower the reserve
#     when the weekly resolve returns to a small limit; raise RAMP_CAP only with
#     evidence about where the real ceiling sits.
#
# A rate-limit bail exits non-zero, but the entries pulled before it are
# flushed and committed by the always()-guarded step below.
#
# A manual workflow_dispatch NEVER applies this ramp — github.event_name is
# 'schedule' only for the actual cron, so a person dispatching this by hand
# always gets exactly the limit/stale-days they typed (or the plain 25/25
# default), never a calendar-computed override they didn't ask for.
#
# The --heal-only portrait step runs on the 1st only, NOT daily. Its set is
# entries never stamped by a successful pull, and null-preserve means an
# artist Spotify has no portrait for never leaves it. That set is currently 9
# and structurally stuck, so a daily heal would burn ~270 requests/month for
# nothing.
#
# Commits ride the established bot pattern: deploy key -> staging ->
# auto-promote. data/artist_spotify.json promoting to main cascade-triggers
# artist-modal-index.yml — expected and desired. History: docs/ISSUE_LOG.md.
#
# The digest step runs BEFORE the commit step, and that order is load-bearing:
# release_digest.py compares the working copy against HEAD, which only shows the
# sweep's findings while the cache is flushed but not yet committed. Move it
# after the commit and it reports nothing every time.
#
# Mail goes out only when the digest found something. Silence on a quiet day is
# the point - an alert channel that mails you to say nothing happened is one you
# stop reading.

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Request budget for this run"
        required: false
        default: "25"
      stale_days:
        description: "Skip entries checked within this many days"
        required: false
        default: "25"
      heal:
        description: "Also run the portrait heal step"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-releases
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests python-dotenv

      - name: Refresh releases (budgeted)
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '25' }}
          STALE_DAYS: ${{ github.event.inputs.stale_days || '25' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # End-of-month ramp - schedule-only, see the header comment above for
          # the full rationale. A manual dispatch keeps exactly the
          # limit/stale-days it was given, ramp or no ramp.
          if [ "$EVENT_NAME" = "schedule" ]; then
            RAMP_CAP=85         # most refresh requests a ramp day may spend
            SUNDAY_RESERVE=60   # held back for the weekly new-artist resolve
            HEAL_RESERVE=15     # held back for the portrait heal on the 1st
            WINDOW_END_DOM=7    # hard stop, day of the next month
            FLAT_LIMIT=$LIMIT   # the plain trickle budget
            FLAT_STALE=$STALE_DAYS

            # RAMP_TODAY exists so the calendar maths can be exercised for any
            # date; a real run leaves it unset and uses the UTC date.
            TODAY="${RAMP_TODAY:-$(date -u +%F)}"
            DOM=$((10#$(date -u -d "$TODAY" +%d)))

            # The month whose last Friday governs today: last month through
            # its WINDOW_END_DOM-th day, this month after that.
            if [ "$DOM" -le "$WINDOW_END_DOM" ]; then
              MONTH_START=$(date -u -d "$(date -u -d "$TODAY" +%Y-%m-01) -1 month" +%F)
            else
              MONTH_START=$(date -u -d "$TODAY" +%Y-%m-01)
            fi
            LAST_DAY=$(date -u -d "$MONTH_START +1 month -1 day" +%F)
            DOW=$(date -u -d "$LAST_DAY" +%u)      # Monday=1 ... Sunday=7
            LAST_FRI=$(date -u -d "$LAST_DAY -$(( (DOW + 2) % 7 )) days" +%F)
            WINDOW_END=$(date -u -d "$MONTH_START +1 month +$((WINDOW_END_DOM - 1)) days" +%F)

            if [[ ! "$TODAY" < "$LAST_FRI" && ! "$TODAY" > "$WINDOW_END" ]]; then
              DAY_SECS=86400
              SINCE_FRI=$(( ($(date -u -d "$TODAY" +%s) - $(date -u -d "$LAST_FRI" +%s)) / DAY_SECS ))
              # Eligible = checked before the Friday: skipped means checked
              # fewer than STALE_DAYS ago, so SINCE_FRI + 1 spares exactly the
              # entries checked on or after it.
              STALE_DAYS=$((SINCE_FRI + 1))

              DAY_CAP=$RAMP_CAP
              [ "$(date -u -d "$TODAY" +%u)" = "7" ] && DAY_CAP=$((DAY_CAP - SUNDAY_RESERVE))
              [ "$DOM" -eq 1 ] && DAY_CAP=$((DAY_CAP - HEAL_RESERVE))
              [ "$DAY_CAP" -lt 0 ] && DAY_CAP=0

              PENDING=$(python3 scripts/spotify_cache.py --refresh-releases \
                --stale-days "$STALE_DAYS" --count-pending \
                | sed -n 's/^--count-pending: \([0-9][0-9]*\) of .*/\1/p' || true)
              if [ -z "$PENDING" ]; then
                echo "::warning::eom-ramp: could not read the pending count; using the flat budget"
                LIMIT=$FLAT_LIMIT
                STALE_DAYS=$FLAT_STALE
              else
                LIMIT=$DAY_CAP
                [ "$PENDING" -lt "$LIMIT" ] && LIMIT=$PENDING
              fi
              echo "eom-ramp: $TODAY, last Friday $LAST_FRI, hard stop $WINDOW_END, pending ${PENDING:-unknown}, day cap $DAY_CAP -> limit $LIMIT, stale-days $STALE_DAYS"
              if [ "$LIMIT" -le 0 ]; then
                # --limit 0 would mean no budget at all downstream; skip instead.
                echo "eom-ramp: nothing to spend today (reserve day or nothing pending) - skipping the refresh"
                exit 0
              fi
            fi
          fi

          python3 scripts/spotify_cache.py --refresh-releases \
            --stale-days "$STALE_DAYS" --limit "$LIMIT"

      - name: Heal unstamped portraits (1st of the month, or on request)
        # Guarded in shell rather than in `if:` — Actions expressions have no
        # access to the current date. Dispatch can force it with heal=true.
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          FORCE_HEAL: ${{ github.event.inputs.heal || 'false' }}
        run: |
          if [ "$(date -u +%d)" != "01" ] && [ "$FORCE_HEAL" != "true" ]; then
            echo "Not the 1st and heal not requested - skipping portrait heal."
            exit 0
          fi
          python3 scripts/spotify_cache.py --refresh-images --heal-only --limit 15

      - name: Mail the release digest
        # always(): a rate-limit bail exits the refresh step non-zero, but the
        # entries pulled before it bailed are real and flushed - they deserve
        # reporting. Mirrors the commit step's reasoning below.
        #
        # Reads the flushed cache against HEAD, so it cannot report entries a
        # bail left unsaved. No API calls: title, type and the Spotify link are
        # already in the cache.
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/release_digest.py > /tmp/release_digest.txt || {
            echo "digest failed - not fatal, the sweep's work is still committed below"
            exit 0
          }
          cat /tmp/release_digest.txt

          # Counts come from --json, not from grepping the rendered report. The
          # header is presentation and now varies ("NEW RELEASES (3) - 1 worth a
          # tour-page check"), so a text parse would break on a formatting change
          # while the JSON carries count and actionable directly. Re-running the
          # digest is free: it reads committed files and makes no API calls.
          python3 scripts/release_digest.py --json > /tmp/release_digest.json || true

          jq_count() {
            python3 -c "import json,sys;print(json.load(open('/tmp/release_digest.json')).get('$1',0))" \
              2>/dev/null || echo 0
          }
          COUNT="$(jq_count count)"
          ACTIONABLE="$(jq_count actionable)"

          if [ "$COUNT" = "0" ]; then
            echo "No new releases - no mail sent."
            exit 0
          fi
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning::$COUNT new release(s) found but RESEND_API_KEY is unset - digest not mailed."
            exit 0
          fi

          # The subject answers "does this need a look" from the inbox list, so a
          # digest with nothing actionable can be left unopened.
          if [ "$COUNT" = "1" ]; then
            SUBJECT="[releases] 1 new"
          else
            SUBJECT="[releases] $COUNT new releases"
          fi
          if [ "$ACTIONABLE" != "0" ]; then
            SUBJECT="$SUBJECT - $ACTIONABLE worth a tour-page check"
          fi
          python3 scripts/notify_email.py \
            --subject "$SUBJECT" \
            --body-file /tmp/release_digest.txt

      - name: Commit to staging if changed
        # always(): a real 429 exits the refresh step non-zero, and without
        # this the runner is destroyed with the flushed checkpoint still on it
        # — the 2026-08-29 run completed 10 refreshes and lost all of them
        # because this step was skipped. The job still reports failure; the
        # work just survives it.
        if: always()
        run: |
          git add data/artist_spotify.json
          if git diff --cached --quiet; then
            echo "data/artist_spotify.json unchanged - nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            git commit -m "ci: daily --refresh-releases sweep (spotify_cache)"
            for attempt in 1 2 3 4 5; do
              git fetch promote staging
              git rebase promote/staging || {
                echo "rebase conflict on staging — bailing (not a race, a real conflict)"
                exit 1
              }
              if git push promote HEAD:staging; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
              echo "push rejected on attempt $attempt (staging moved) — retrying after ${attempt}s backoff"
              sleep "$attempt"
            done
            echo "gave up after 5 attempts"
            exit 1
          fi
