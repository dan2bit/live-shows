name: Private data guard

# Layer-3 backstop for the private-data leak incident (see docs/ISSUE_LOG.md).
# Fails any push or
# PR that introduces the private sidecar into this PUBLIC repo. The private
# ledger (cost / seat / qty / private notes) and fast-track caps belong ONLY in
# the separate dan2bit/live-shows-private repo — never at a path inside this one.
# .gitignore discourages it locally but is bypassable with `git add -f`; this is
# the server-side check that makes it un-mergeable once set as a required status
# check on main (Settings -> Branches).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block private sidecar files in the public repo
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          # NOTE: the path rule + sniff below are MIRRORED in auto-promote.yml's
          # inline guard step — any change here must be applied there too (and
          # vice versa). The drift check further down is guard-only by design.

          # 1. Path patterns — the private sidecar must never be tracked here.
          offending="$(git ls-files | grep -E '^live-shows-private/|_private\.tsv$|_caps\.tsv$' || true)"
          if [ -n "$offending" ]; then
            echo "::error::Private sidecar path(s) committed to the PUBLIC repo:"
            printf '%s\n' "$offending" | sed 's/^/  - /'
            fail=1
          fi

          # 2. Content sniff — a private schema header smuggled in under another
          #    name. Public TSVs carry no "Private Notes" column by design, so its
          #    presence in a header line means a private sidecar slipped in renamed.
          # sample-files/private/ is exempt: those files carry the private schema
          # headers ON PURPOSE (forker seeds, synthetic rows only — see
          # sample-files/README.md).
          sniff="$(git ls-files '*.tsv' | grep -v '^sample-files/private/' | while IFS= read -r f; do
            if head -n 1 -- "$f" | grep -qi 'Private Notes'; then printf '%s\n' "$f"; fi
          done)"
          if [ -n "$sniff" ]; then
            echo "::error::TSV(s) with a 'Private Notes' header (private schema in the public repo):"
            printf '%s\n' "$sniff" | sed 's/^/  - /'
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Private financial data (cost / seat / qty / private notes / fast-track caps)"
            echo "belongs ONLY in the separate repo dan2bit/live-shows-private — never at a path"
            echo "inside this public repo. See docs/ISSUE_LOG.md and the matching .gitignore block."
            exit 1
          fi

          echo "OK — no private sidecar files or private-schema headers in the public repo."

      - name: Sample-file header drift check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          # Compare each public sample's header against its canonical file.
          # The mapping is imported from fork_reset.py so there is exactly one
          # source of truth; private samples are not in SAMPLE_MAP (their
          # canonicals live in the private repo) and are hand-maintained.
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("fr", "scripts/fork_reset.py")
          fr = importlib.util.module_from_spec(spec); spec.loader.exec_module(fr)
          def header(path):
              with open(path, encoding="utf-8-sig") as f:
                  for line in f:
                      if not line.startswith("#"):
                          return line.rstrip("\n")
              return ""
          bad = []
          for sample, canon in fr.SAMPLE_MAP.items():
              hs, hc = header(sample), header(canon)
              if hs != hc:
                  bad.append((sample, canon, hs, hc))
          if bad:
              for s, c, hs, hc in bad:
                  print(f"::error::sample header drift: {s} != {c}")
                  print(f"  sample:    {hs}")
                  print(f"  canonical: {hc}")
              sys.exit(1)
          print(f"OK — {len(fr.SAMPLE_MAP)} sample headers match their canonical files.")
          EOF
