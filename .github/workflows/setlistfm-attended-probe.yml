name: setlistfm-attended-probe

# Temporary and manual: run it, read the job summary, then delete it along with
# scripts/probe_setlistfm_attended.py.
#
# The attendance reconcile planned for check_setlists.py depends on things only the
# live API can answer: whether /1.0/user/{user}/attended works with this key, how the
# list is ordered, and so whether a weekly run can stop after page 1 or has to walk
# every page to see a show marked attended long after it happened. The probe pulls
# the list once, compares it with the archive export the history was built from,
# and reports each of those, plus a preview count of attended setlists that no
# ledger row links to. The key is the same SETLISTFM_API_KEY data-hygiene.yml uses;
# without it the probe says so and asks nothing.

on:
  workflow_dispatch:
    inputs:
      user:
        description: setlist.fm user whose attended list to pull
        default: dan2bit
      max_pages:
        description: hard cap on attended pages (20 setlists each)
        default: "40"
      try_search:
        description: also test whether the search endpoint honours an attendee parameter
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Probe the attended endpoint
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          PROBE_USER: ${{ inputs.user }}
          PROBE_MAX_PAGES: ${{ inputs.max_pages }}
          PROBE_SEARCH: ${{ inputs.try_search }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--user "$PROBE_USER" --max-pages "$PROBE_MAX_PAGES" --json probe.json)
          if [ "$PROBE_SEARCH" = "true" ]; then args+=(--try-search); fi
          python3 scripts/probe_setlistfm_attended.py "${args[@]}"

      - name: Keep the raw pull
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setlistfm-attended-probe
          path: probe.json
          if-no-files-found: ignore
          retention-days: 14
