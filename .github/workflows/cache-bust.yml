name: Cache-bust static assets

# Rewrites the ?v= query strings on app.js, recommend.js, artist-modal.js,
# artist-modal.css and styles.css to the current commit SHA whenever any of those
# files change, forcing browsers/CDN to fetch the new versions immediately.
# Host pages carrying these references: index.html (all five); the artist-graph
# research page (artist-modal.js/.css via a ../../../ prefix); and the festival
# posters (artist-modal.js/.css via a ../ prefix) - both the templates under
# tools/festival/ and the rendered pages under festival/, kept in step here so
# `render_posters.py --check` stays clean after a bump. The sed patterns capture
# any leading path, so one pass covers every host.
#
# main requires the `guard` status check, so this commits to `staging`
# via the promote deploy key (which also makes the staging push trigger
# auto-promote — GITHUB_TOKEN pushes would not). No [skip ci]: we WANT
# auto-promote to run. No host page is a watched path, so promotion back to
# main does not retrigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - app.js
      - recommend.js
      - artist-modal.js
      - artist-modal.css
      - styles.css
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-bust
  cancel-in-progress: false

jobs:
  bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rewrite asset version strings in the host pages
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:8}"
          HOSTS="index.html tools/research/graph/artist-graph.html \
                 tools/festival/poster_timeline.template.html tools/festival/poster_crescendo.template.html \
                 festival/festival_poster.html festival/index.html"

          # Replace any existing ?v=... or no version at all, for each asset.
          # Patterns handle both: href="styles.css" and href="styles.css?v=abc123",
          # and \1 captures an optional leading path (../../../ on the graph page)
          # so the same pass rewrites a repo-relative reference from any depth.
          sed -i \
            -e "s|href=\"\([^\"]*/\)\?styles\.css\(?[^\"]*\)\?\"|href=\"\1styles.css?v=${SHORT}\"|g" \
            -e "s|href=\"\([^\"]*/\)\?artist-modal\.css\(?[^\"]*\)\?\"|href=\"\1artist-modal.css?v=${SHORT}\"|g" \
            -e "s|src=\"\([^\"]*/\)\?app\.js\(?[^\"]*\)\?\"|src=\"\1app.js?v=${SHORT}\"|g" \
            -e "s|src=\"\([^\"]*/\)\?recommend\.js\(?[^\"]*\)\?\"|src=\"\1recommend.js?v=${SHORT}\"|g" \
            -e "s|src=\"\([^\"]*/\)\?artist-modal\.js\(?[^\"]*\)\?\"|src=\"\1artist-modal.js?v=${SHORT}\"|g" \
            $HOSTS

          echo "Updated asset references to ?v=${SHORT}"
          grep -HE '(app\.js|recommend\.js|artist-modal\.(js|css)|styles\.css)' $HOSTS

      - name: Commit to staging if changed
        run: |
          git add index.html tools/research/graph/artist-graph.html \
                  tools/festival/poster_timeline.template.html tools/festival/poster_crescendo.template.html \
                  festival/festival_poster.html festival/index.html
          if git diff --cached --quiet; then
            echo "host pages unchanged — nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            git commit -m "ci: cache-bust static assets"
            for attempt in 1 2 3 4 5; do
              git fetch promote staging
              git rebase promote/staging || {
                echo "rebase conflict on staging — bailing (not a race, a real conflict)"
                exit 1
              }
              if git push promote HEAD:staging; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
              echo "push rejected on attempt $attempt (staging moved) — retrying after ${attempt}s backoff"
              sleep "$attempt"
            done
            echo "gave up after 5 attempts"
            exit 1
          fi
