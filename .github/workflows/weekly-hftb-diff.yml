name: Weekly HFTB refresh

# Workflow 1-W (see tools/playbooks/ANALYSIS_WORKFLOWS.md). Re-scrapes the
# HereForTheBands listing and diffs it against last week's committed copy, so
# HFTB's breadth stops sitting unread for 29 days between monthly passes.
#
# HFTB ONLY, deliberately. jc.php is unauthenticated and unpersonalised, so it
# fetches from a runner with no browser and no session. The Bandsintown
# recommends view is personalised to the rhbl follow graph and CANNOT be added
# here: without the session it returns a generic DC listing that looks
# plausible and is not ours. BIT stays on the monthly browser pass.
#
# Cost of the split: no two-source corroboration, so the weekly report's
# shortlist is noisier per hit than the monthly one. Single-source hits fall
# back to the core-venue tier, which is a browse list rather than a decision
# list.
#
# The digest is mailed to rhbl via scripts/notify_email.py (Resend, the
# RESEND_API_KEY repository secret - an API key that can only push mail through
# Resend, not a mailbox credential). The job summary still gets a copy; the mail
# is what actually gets read between sessions.
#
# Quiet weeks send nothing. A weekly mail reporting that nothing happened is how
# an alert channel teaches you to ignore it. History: docs/ISSUE_LOG.md.
#
# Commits ride the established bot pattern: deploy key -> staging ->
# auto-promote, with the rebase retry loop copied from the release-refresh
# workflow.

on:
  schedule:
    - cron: "0 11 * * 5"
  workflow_dispatch:
    inputs:
      region:
        description: "HFTB region bitmask (dc=1 bal=2 wd=4 phi=8)"
        required: false
        default: "3"
      days:
        description: "Max calendar days to walk"
        required: false
        default: "420"
      rebaseline:
        description: "Scrape and commit WITHOUT diffing (use after a region change)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-hftb
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: staging

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stage last week's copy before anything overwrites it
        # scrape_hftb.py writes in place. If this runs after the scrape, the
        # diff compares the new file against itself and reports nothing new -
        # which reads as a quiet week rather than a broken job.
        #
        # On the first run of a calendar month the current-month file does not
        # exist yet, so there is nothing to stage; PRIOR_LABEL then points at
        # last month's file and the run degrades to a month-over-month diff,
        # which is correct rather than a failure.
        id: stage
        run: |
          set -euo pipefail
          MONTH="$(date -u +%Y-%m)"
          PREV_MONTH="$(date -u -d '1 month ago' +%Y-%m)"
          CUR="tools/research/web-src/rhbl-hereforthebands-dc-${MONTH}.tsv"

          if [ -f "$CUR" ]; then
            cp "$CUR" /tmp/hftb-prev.tsv
            echo "prior_file=/tmp/hftb-prev.tsv" >> "$GITHUB_OUTPUT"
            echo "prior_label=last-week"          >> "$GITHUB_OUTPUT"
            echo "Staged $(wc -l < "$CUR") lines from $CUR"
          else
            ARCH="tools/archive/rhbl-hereforthebands-dc-${PREV_MONTH}.tsv"
            SRC="tools/research/web-src/rhbl-hereforthebands-dc-${PREV_MONTH}.tsv"
            if   [ -f "$SRC" ];  then cp "$SRC"  /tmp/hftb-prev.tsv
            elif [ -f "$ARCH" ]; then cp "$ARCH" /tmp/hftb-prev.tsv
            else echo "No current-month and no prior-month file - first run?"; fi
            if [ -f /tmp/hftb-prev.tsv ]; then
              echo "prior_file=/tmp/hftb-prev.tsv" >> "$GITHUB_OUTPUT"
            fi
            echo "prior_label=${PREV_MONTH}" >> "$GITHUB_OUTPUT"
            echo "New month - comparing against ${PREV_MONTH}"
          fi
          echo "month=${MONTH}" >> "$GITHUB_OUTPUT"
          echo "file=${CUR}"    >> "$GITHUB_OUTPUT"

      - name: Scrape HFTB
        env:
          REGION: ${{ github.event.inputs.region || '3' }}
          DAYS: ${{ github.event.inputs.days || '420' }}
        run: |
          python3 tools/research/web-src/scrape_hftb.py \
            --region "$REGION" --days "$DAYS" --quiet

      - name: Diff against last week
        id: diff
        if: ${{ github.event.inputs.rebaseline != 'true' }}
        env:
          FILE: ${{ steps.stage.outputs.file }}
          PRIOR_FILE: ${{ steps.stage.outputs.prior_file }}
          MONTH: ${{ steps.stage.outputs.month }}
          PRIOR_LABEL: ${{ steps.stage.outputs.prior_label }}
        run: |
          set -euo pipefail
          if [ -z "${PRIOR_FILE:-}" ]; then
            echo "No prior file to diff against - skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 tools/research/websrc_diff.py --source hftb \
            --month "$MONTH" --prior "$PRIOR_LABEL" \
            --file "$FILE" --prior-file "$PRIOR_FILE" > /tmp/hftb_diff.txt

          {
            echo '## Weekly HFTB diff'
            echo
            echo '```'
            cat /tmp/hftb_diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Counts come from --json, not from grepping the rendered report. The
          # section headings are presentation; a formatting change would silently
          # break a text parse, while the JSON carries the arrays themselves.
          python3 tools/research/websrc_diff.py --source hftb \
            --month "$MONTH" --prior "$PRIOR_LABEL" \
            --file "$FILE" --prior-file "$PRIOR_FILE" --json > /tmp/hftb_diff.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open('/tmp/hftb_diff.json'))
          untracked = sum(len(d.get(k, [])) for k in (
              'untracked_corroborated',
              'untracked_single_source_core_venue',
              'label_roster_hits'))
          print('untracked=%d' % untracked)
          print('tracked_new=%d' % len(d.get('tracked_new', [])))
          PY

      - name: Mail the weekly diff
        # Skipped on a re-baseline for the same reason the diff step is: a region
        # change makes every newly-covered act look new, and that is a coverage
        # change rather than a week of announcements.
        if: ${{ github.event.inputs.rebaseline != 'true' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNTRACKED: ${{ steps.diff.outputs.untracked }}
          TRACKED_NEW: ${{ steps.diff.outputs.tracked_new }}
        run: |
          set -euo pipefail
          [ -f /tmp/hftb_diff.txt ] || { echo "No diff produced - nothing to mail."; exit 0; }

          U="${UNTRACKED:-0}"
          T="${TRACKED_NEW:-0}"

          # websrc_diff always prints a header and counts, so notify_email's
          # empty-body rule cannot suppress a quiet week on its own.
          if [ "$U" = "0" ] && [ "$T" = "0" ]; then
            echo "quiet week - no mail sent."
            exit 0
          fi
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning::$U untracked / $T tracked-new found but RESEND_API_KEY is unset - digest not mailed."
            exit 0
          fi

          SUBJECT="[hftb] $U untracked new ($(date -u +%Y-%m-%d))"
          [ "$T" = "0" ] || SUBJECT="[hftb] $U untracked, $T tracked ($(date -u +%Y-%m-%d))"
          python3 scripts/notify_email.py --subject "$SUBJECT" --body-file /tmp/hftb_diff.txt

      - name: Note the re-baseline
        if: ${{ github.event.inputs.rebaseline == 'true' }}
        run: |
          {
            echo '## Re-baseline run'
            echo
            echo 'Scraped and committed WITHOUT diffing. A region change makes every'
            echo 'newly-covered act look new, which is a coverage change and not a'
            echo 'week of announcements. Next weekly run diffs against this file.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the refreshed scrape to staging
        # always(): the scrape flushes as it goes, so a partial file is still
        # worth keeping if a later step fails. Matches the release-refresh
        # workflow's reasoning.
        if: always()
        env:
          FILE: ${{ steps.stage.outputs.file }}
        run: |
          set -euo pipefail
          [ -f "$FILE" ] || { echo "No scrape file produced - nothing to commit."; exit 0; }
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "$FILE unchanged - nothing to commit."
            exit 0
          fi

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
          chmod 600 "$HOME/.ssh/promote_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

          git commit -m "ci: weekly HFTB refresh (region ${{ github.event.inputs.region || '3' }})"
          for attempt in 1 2 3 4 5; do
            git fetch promote staging
            git rebase promote/staging || {
              echo "rebase conflict on staging - bailing (not a race, a real conflict)"
              exit 1
            }
            if git push promote HEAD:staging; then
              echo "push succeeded on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt (staging moved) - retrying after ${attempt}s"
            sleep "$attempt"
          done
          echo "gave up after 5 attempts"
          exit 1
