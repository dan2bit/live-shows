# Data hygiene — drift scans, blocking or advisory depending on the check.
#
#   - check_ascii_punctuation.py — non-ASCII punctuation in pipeline-consumed
#     data (curly quotes / long dashes orphan sidecar and goal-join keys).
#     BLOCKING on a staging push and on any PR into main/staging: eight fixed
#     characters, no heuristic, mechanical fix.
#   - check_name_drift.py — artist-name near-collisions, near-miss drift, and
#     alias coverage across every artist-bearing column. ADVISORY everywhere,
#     permanently: near-miss matching has intrinsic false positives, and a fuzzy
#     check that can fail a run is how a guard ends up switched off.
#   - check_evergreen.py — issue references and changelog dates creeping back
#     into forker-facing comments and printed strings (history belongs in
#     docs/ISSUE_LOG.md). BLOCKING on a staging push and on any PR into
#     main/staging, but only for the files the change touched; the full-repo
#     scan stays advisory.
#   - check_setlists.py — the setlist.fm links every show carries. Three checks in
#     one script. PAIRING (a MULTI marker has its data/setlists entry and the
#     reverse; a marker's date is its row's date; every entry lists acts with
#     URLs) is mechanical and BLOCKING on a staging push and on any PR into
#     main/staging. LINK SANITY (a URL's year and venue against the show; one
#     setlist filed under two shows; a MULTI entry with a single setlist) is a
#     heuristic and ADVISORY permanently. VERIFICATION asks the setlist.fm API for
#     the date, venue and artist behind each link and is ADVISORY permanently: it
#     depends on an outside service and on data anyone can edit. It needs the
#     SETLISTFM_API_KEY secret and skips, without failing, when the secret is
#     absent, which is always the case on a PR from a fork. A push or a PR
#     verifies only the links it added or changed. The weekly run and a manual
#     dispatch verify every link not verified in the last 45 days, inside a
#     request budget, reusing the facts kept in the Actions cache.
#   - reconcile_follows.py --hygiene — the follows-pipeline invariants that need
#     only the repo (NAR/follows_master overlap, NAR/artists overlap, fast_track
#     rows with no follows_master row). ADVISORY everywhere: a violation is a
#     ledger to tidy, not a push to reject, and the follows-watch mail gives it
#     a reader.
#
# WHERE IT BLOCKS: a staging push and a PR into main/staging are the blocking
# contexts. A direct push to main runs everything advisory, so a pre-existing
# finding elsewhere in the repo never fails an unrelated run (the PR that
# introduced a change is where it gets caught; the post-merge main push is a
# backstop, not the gate). Every check writes a $GITHUB_STEP_SUMMARY section every
# run, clean or not, so the findings are readable without opening a job log.
#
# WHAT "BLOCKING" MEANS HERE:
#   - On a staging PUSH: a strict failure fails THIS workflow, which marks the
#     commit red and sends the usual workflow-failure notification. It does not
#     by itself stop auto-promote.yml from fast-forwarding main — that workflow
#     does not depend on this one, and main's required status check is the
#     private-data guard. Gating the promote on hygiene is a change to
#     auto-promote.yml, not something this file can do. So on a push this is a
#     loud signal, not a hard gate.
#   - On a PULL REQUEST into main/staging: a strict failure fails the workflow
#     run reported against the PR. That becomes a hard gate ONLY if this check
#     is added to the target branch's required status checks in branch
#     protection (the check name to require is the job, "hygiene"). Until then
#     it is the same loud-signal-not-a-gate as the push case — a red X on the
#     PR that a reviewer can still merge past. Making it a true pre-merge gate
#     is a branch-protection setting, not something this file can do.
name: data-hygiene

on:
  push:
    branches: [main, staging]
    paths:
      - "data/**"
      - "config.yaml"
      - "scripts/**"
      - "*.js"
      - "*.css"
      - "*.html"
      - "tools/research/**"
      - ".github/workflows/**"
  pull_request:
    # PRs into either integration branch get the same scans BEFORE the merge,
    # so a blocking finding is caught pre-merge rather than after it lands on
    # staging. Same paths filter as push.
    branches: [main, staging]
    paths:
      - "data/**"
      - "config.yaml"
      - "scripts/**"
      - "*.js"
      - "*.css"
      - "*.html"
      - "tools/research/**"
      - ".github/workflows/**"
  schedule:
    # Weekly sweep of the setlist.fm verification. A scheduled run is on the
    # default branch, so every check is advisory here (see WHERE IT BLOCKS).
    - cron: "37 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the evergreen scope is derived from the push diff.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml

      - name: Resolve blocking mode and the change diff
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          # Blocking contexts: a push to staging, or a PR into main/staging.
          # Everything else (a direct push to main, a manual dispatch) is
          # advisory. Computed once here so the scan steps stay simple.
          blocking=false
          before=""
          head='${{ github.sha }}'
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            blocking=true
            # The PR range is base..head. github.sha on a pull_request event is
            # the ephemeral merge commit, not the PR head; use the PR head sha so
            # the diff reflects exactly what the PR changes.
            before='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          elif [ '${{ github.ref }}' = 'refs/heads/staging' ]; then
            blocking=true
            before='${{ github.event.before }}'
            # A new branch, or a push whose old tip is no longer reachable, leaves
            # nothing usable in event.before; fall back to the first parent.
            if [ -z "$before" ] \
              || [ "$before" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              # --verify -q so a missing parent yields an empty string rather
              # than rev-parse echoing the literal argument back.
              before="$(git rev-parse --verify -q 'HEAD~1' || true)"
            fi
          fi
          files=""
          if [ -n "$before" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only --diff-filter=d "$before" "$head" \
              -- '*.py' '*.js' '*.css' '*.html' '*.yml' 'config.yaml' | tr '\n' ' ')"
          fi
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "blocking mode: $blocking"
          echo "evergreen scope: ${files:-<none - advisory this run>}"

      - name: ASCII punctuation scan
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.diff.outputs.blocking }}' = 'true' ]; then
            python scripts/check_ascii_punctuation.py --strict
          else
            python scripts/check_ascii_punctuation.py
          fi

      - name: Artist-name drift scan
        run: python scripts/check_name_drift.py

      # Potentials prose that records a decision or purchase state goes stale the
      # moment the Decision column changes on the web, and nothing else re-reads it.
      # Text heuristic with real false positives, so advisory in every context; the
      # cross-row Decision disagreements it reports are the ones worth acting on.
      - name: Potentials status-wording scan
        run: python scripts/check_potential_status_notes.py

      # Identity data lint (artist_relations.tsv, bill_annotations.tsv), the shared
      # identity fixture against the resolver and the artist modal index, and the
      # resolver self-tests. A lint error or fixture failure is a real break in any
      # context; the non-canonical map-key and past-review notices are warnings only.
      - name: Artist identity
        run: python scripts/check_identity.py

      - name: Evergreen scan
        shell: bash
        run: |
          set -euo pipefail
          files='${{ steps.diff.outputs.files }}'
          # An empty list would mean "the whole repo" to --strict, which is not
          # the intent when a change touched no scannable file; stay advisory.
          if [ '${{ steps.diff.outputs.blocking }}' = 'true' ] && [ -n "$files" ]; then
            # shellcheck disable=SC2086
            python scripts/check_evergreen.py --strict $files
          else
            python scripts/check_evergreen.py
          fi

      - name: Restore setlist.fm verification cache
        uses: actions/cache@v4
        with:
          path: .cache/setlistfm-verified.json
          key: setlistfm-verified-${{ github.run_id }}
          restore-keys: |
            setlistfm-verified-

      - name: Setlist pairing, link sanity and setlist.fm verification
        shell: bash
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          set -euo pipefail
          args=(--api --cache .cache/setlistfm-verified.json)
          if [ '${{ steps.diff.outputs.blocking }}' = 'true' ]; then
            args+=(--strict)
          fi
          # A push or a PR verifies only the links it added or changed. The
          # scheduled run and a manual dispatch have no range, so they verify
          # every link that has not been verified recently.
          before=""
          head='${{ github.sha }}'
          case '${{ github.event_name }}' in
            pull_request)
              before='${{ github.event.pull_request.base.sha }}'
              head='${{ github.event.pull_request.head.sha }}'
              ;;
            push)
              before='${{ github.event.before }}'
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                # A new branch has no previous tip; compare with the first parent
                # rather than sweeping the whole ledger on a push.
                before='HEAD~1'
              fi
              ;;
          esac
          if [ -n "$before" ]; then
            args+=(--changed "$before" "$head")
          fi
          python scripts/check_setlists.py "${args[@]}"

      - name: Follows-pipeline invariants
        run: python tools/research/reconcile_follows.py --hygiene
