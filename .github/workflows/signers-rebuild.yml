name: Rebuild signers page

# Closes the hat_signatures.tsv -> signers/index.html loop: every hat
# signing lands in the TSV via Routine 2, and this regenerates the built
# page and its single-page print PDF from it, so there is nothing left to
# hand-maintain (the old Google Doc drifted from the TSV specifically
# because its per-signing append was a manual, skippable step, and was in
# fact skipped for the show that prompted this fix). Full design history:
# docs/ISSUE_LOG.md.
#
# main requires the `guard` status check, so this commits to `staging` via
# the promote deploy key (which also makes the staging push trigger
# auto-promote - GITHUB_TOKEN pushes would not).
#
# The build runs on a checkout of `staging`, not `main`, even though the
# trigger is a push to main - deliberately, not by oversight. This is the
# fix for the failure class artist-modal-index.yml hit on 2026-09-25/26:
# that workflow checks out main with no ref, so a second run queued behind
# a first can build from a tree that does not yet have the first run's own
# output promoted into it, rebuild the same bytes, see them as a change
# against its stale tree, and hit an unresolvable rebase conflict when it
# tries to push - two independently-computed full rewrites of the same
# generated file cannot be 3-way merged. Building from staging instead
# means the rebase onto staging is a no-op unless staging genuinely moved
# mid-build, which the retry loop below already handles. See map-rebuild.yml
# for the same pattern applied to the fantasy-map data, and its own header
# comment for the fuller incident writeup this is adapted from.
#
# render_signers.py is deterministic (plain string templating, no
# timestamps, no randomness) - identical inputs produce byte-identical
# output, so an unrelated push that does not actually change any watched
# input's content never produces a diff, and the commit step below no-ops.
# The PDF is reproducible by construction too: render_signers_pdf.py pins
# SOURCE_DATE_EPOCH to the newest signature date (WeasyPrint would otherwise
# stamp the current time and commit a new binary on every run), and the
# WeasyPrint version is pinned below so a library upgrade cannot change the
# bytes unannounced. Bump the pin on purpose, and expect one PDF commit.
#
# This file is a watched path too, so changing it (moving the runner pin, say) rebuilds
# the page and the PDF at once. Without that, a workflow edit that touches no other
# watched file starts nothing, and the new version sits unexercised until some data
# change happens to trigger it.
#
# data/artist_modal_index.json and config.yaml are watched because the page
# reads them: a name links into the artist modal only when the index has a
# record for it, and the head URLs come from config.yaml's site block. A
# newly resolvable artist therefore gets linked on the next run with no
# manual rebuild. Most runs started that way change nothing and commit
# nothing.
#
# A print overflow must never block the web page. The PDF dependencies and
# the PDF step are allowed to fail; the commit step still lands the
# refreshed page, and the last step then fails the run so the problem is
# visible instead of quietly leaving a stale PDF behind.
#
# The PDF is only attempted when it could differ. The page is rebuilt first
# (it needs nothing but pyyaml), and the gate step then asks whether the PDF
# has anything new to print: the page changed, the PDF file is missing, the
# push touched something the PDF depends on that the page does not (the PDF
# script, the banner and QR images, this file), or the run was started by
# hand. Most runs are started by a watched file that leaves the page
# identical, and those now skip the system packages and WeasyPrint entirely.
#
# A PDF that could not be built fails the run only when the page moved ahead
# of it. When the page did not change, the committed PDF is not behind the
# page, so the same failure (a package mirror that will not resolve, say) is
# reported as a warning and the run stays green.
#
# The system packages come from a cache when they can. The runner image
# already carries most of what WeasyPrint needs; the few packages it lacks
# are downloaded once as .deb files, kept with actions/cache, and installed
# from there on later runs with no network at all. That takes the Ubuntu
# package mirrors out of the ordinary path - an outage there once failed
# this job three runs in a row - and it also holds those library versions
# still between runs, which is what the byte-reproducible PDF wants anyway.
# The mirrors are only used when the cache is empty (GitHub evicts a cache
# that goes a week unused) or when a cached package no longer installs
# because the image moved on; either way the fresh download is cached again.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/signers-rebuild.yml
      - data/show_goals/hat_signatures.tsv
      - data/venues.tsv
      - data/artist_modal_index.json
      - config.yaml
      - tools/signers/signers.yaml
      - tools/signers/signers.template.html
      - tools/signers/render_signers.py
      - tools/signers/render_signers_pdf.py
      - static/hat-banner.svg
      - static/hat-banner.png
      - static/hat-playlist-qr.svg
      - static/redhat-bootlegs-qr.svg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signers-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    # Pinned rather than ubuntu-latest, on purpose. The print PDF is byte-reproducible
    # only on one stack of system libraries (pango, harfbuzz, freetype and the fonts),
    # and a floating label lets two images take turns building it, which would commit a
    # different PDF each time. Move the pin deliberately: build the PDF on the new image
    # first, compare it with the committed one, then change this line and expect one PDF
    # commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Rebuild signers/index.html
        run: python3 tools/signers/render_signers.py
      - name: Decide whether the print PDF needs rebuilding
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Inputs the PDF has that the page does not: a change to any of these
          # can alter the PDF while leaving signers/index.html byte-identical.
          PDF_ONLY_INPUTS=".github/workflows/signers-rebuild.yml tools/signers/render_signers_pdf.py static/hat-banner.svg static/hat-playlist-qr.svg static/redhat-bootlegs-qr.svg"

          if [ -n "$(git status --porcelain -- signers/index.html)" ]; then
            page_changed=true
          else
            page_changed=false
          fi

          pdf_name="$(python3 -c "import yaml; print(yaml.safe_load(open('tools/signers/signers.yaml'))['print_pdf'])")"

          reason=""
          if [ "$page_changed" = "true" ]; then
            reason="signers/index.html changed"
          elif [ ! -f "signers/$pdf_name" ]; then
            reason="signers/$pdf_name does not exist yet"
          elif [ "$EVENT_NAME" != "push" ]; then
            reason="started by $EVENT_NAME"
          elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git cat-file -e "$AFTER^{commit}" 2>/dev/null; then
            # No usable before/after pair (first push, rewritten history): build
            # rather than guess.
            reason="the pushed range could not be read"
          elif ! git diff --quiet "$BEFORE" "$AFTER" -- $PDF_ONLY_INPUTS; then
            reason="the push touched a PDF-only input: $(git diff --name-only "$BEFORE" "$AFTER" -- $PDF_ONLY_INPUTS | tr '\n' ' ')"
          fi

          echo "page_changed=$page_changed" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding the print PDF: $reason"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the print PDF: the page is unchanged and the push touched nothing the PDF alone depends on."
          fi
      - name: Restore cached PDF system packages
        id: debcache
        if: steps.gate.outputs.build == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ~/signers-pdf-debs
          # A cache entry cannot be overwritten, so each save gets its own key
          # and a restore takes the newest one that shares the prefix. The
          # prefix carries the runner image, so moving the runs-on pin starts
          # a fresh set of packages.
          key: signers-pdf-debs-ubuntu-24.04-${{ github.run_id }}
          restore-keys: |
            signers-pdf-debs-ubuntu-24.04-
      - name: Install PDF dependencies
        id: pdfdeps
        if: steps.gate.outputs.build == 'true'
        continue-on-error: true
        run: |
          PACKAGES="libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-liberation"
          DEBS="$HOME/signers-pdf-debs"
          mkdir -p "$DEBS"

          missing_packages() {
            for pkg in $PACKAGES; do
              dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "install ok installed" || printf '%s ' "$pkg"
            done
          }

          missing="$(missing_packages)"
          if [ -z "$missing" ]; then
            echo "All PDF system packages are already on the runner image."
          elif ls "$DEBS"/*.deb >/dev/null 2>&1 && sudo dpkg -i "$DEBS"/*.deb && [ -z "$(missing_packages)" ]; then
            echo "Installed from the package cache, no download needed: $missing"
          else
            # Nothing cached, or the cached packages no longer fit the image.
            # Download the missing ones afresh and keep them for next time.
            echo "Downloading from the package mirrors: $missing"
            rm -f "$DEBS"/*.deb
            sudo apt-get update -qq -o Acquire::Retries=3
            (cd "$DEBS" && apt-get download -o Acquire::Retries=3 $missing)
            sudo apt-get install -y -qq -o Acquire::Retries=3 $PACKAGES
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi
          pip install "weasyprint==70.0"
      - name: Save downloaded PDF system packages
        if: steps.pdfdeps.outputs.fetched == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/signers-pdf-debs
          key: signers-pdf-debs-ubuntu-24.04-${{ github.run_id }}
      - name: Rebuild the print PDF
        id: pdf
        if: steps.gate.outputs.build == 'true' && steps.pdfdeps.outcome == 'success'
        continue-on-error: true
        run: python3 tools/signers/render_signers_pdf.py
      - name: Commit to staging if changed
        run: |
          git add signers/
          if git diff --cached --quiet; then
            echo "signers/ unchanged - nothing to commit."
          else
            mkdir -p "$HOME/.ssh"
            printf '%s\n' "${{ secrets.PROMOTE_DEPLOY_KEY }}" > "$HOME/.ssh/promote_key"
            chmod 600 "$HOME/.ssh/promote_key"
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/promote_key -o StrictHostKeyChecking=accept-new"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add promote "git@github.com:${GITHUB_REPOSITORY}.git"

            git commit -m "ci: regenerate signers page and print PDF"
            git checkout -- .
            for attempt in 1 2 3 4 5; do
              git fetch promote staging
              git rebase promote/staging || {
                echo "rebase conflict on staging - only this job writes signers/ and it is serialised, so staging moved under it in a way a retry will not fix"
                exit 1
              }
              if git push promote HEAD:staging; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
              echo "push rejected on attempt $attempt (staging moved) - retrying after ${attempt}s backoff"
              sleep "$attempt"
            done
            echo "gave up after 5 attempts"
            exit 1
          fi
      - name: Report a print PDF that could not be built
        if: steps.gate.outputs.build == 'true' && (steps.pdfdeps.outcome == 'failure' || steps.pdf.outcome == 'failure')
        env:
          PAGE_CHANGED: ${{ steps.gate.outputs.page_changed }}
        run: |
          if [ "$PAGE_CHANGED" = "true" ]; then
            echo "::error::signers/index.html was refreshed, but the print PDF was not (dependencies failed to install, or the list no longer fits one page). See the two PDF steps above."
            exit 1
          fi
          echo "::warning::The print PDF could not be rebuilt (dependencies failed to install, or the list no longer fits one page - see the two PDF steps above). signers/index.html did not change in this run, so the committed PDF is not behind the page. If this run was started by a change to the PDF script, the banner or QR images, or this workflow, re-run it to pick that change up."
