name: Weekly potentials digest

# Sweeps the gap between a potentials row and the purchase - an on-sale date
# written into Watching For and never checked, a Buy row whose show is next week
# with nothing bought, a row with no price or link. All of it is visible in
# committed data that nothing re-reads between sessions.
#
# READ-ONLY, and deliberately so. No commit step, no calendar access, no row
# edits. Downgrading a stale Choose to Pass is a judgement rather than
# maintenance, and the public repo's Actions hold no calendar credential - the
# conflict check stays in session, where it already lives.
#
# Monday morning, ahead of the week's on-sales. potentials-maintenance.yml is
# the other consumer of these files and is unaffected: it fires on push and
# reconciles, this one only reports.
#
# Quiet weeks send nothing. potentials_digest.py prints nothing at all when
# every section is empty, so notify_email.py's empty-body rule suppresses the
# mail without this workflow needing to count anything.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      today:
        description: "Override today's date (YYYY-MM-DD) - for testing windows"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-potentials-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the digest
        id: digest
        env:
          TODAY: ${{ github.event.inputs.today }}
        run: |
          set -euo pipefail
          ARGS=""
          [ -n "${TODAY:-}" ] && ARGS="--today $TODAY"

          python3 scripts/potentials_digest.py $ARGS > /tmp/potentials_digest.txt
          python3 scripts/potentials_digest.py $ARGS --json > /tmp/potentials_digest.json

          if [ -s /tmp/potentials_digest.txt ]; then
            {
              echo '## Weekly potentials digest'
              echo
              echo '```'
              cat /tmp/potentials_digest.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Nothing needs attention this week.' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat /tmp/potentials_digest.txt

          # Counts come from --json rather than from grepping the report: the
          # section headings are presentation, and a formatting change would
          # silently break a text parse. Re-running costs nothing - the script
          # reads two committed files and makes no network calls.
          count_of () {
            python3 -c "import json;d=json.load(open('/tmp/potentials_digest.json'));print(len(d.get('$1',[])))" \
              2>/dev/null || echo 0
          }
          ACTIONS="$(python3 -c "import json;print(json.load(open('/tmp/potentials_digest.json')).get('action_count',0))" 2>/dev/null || echo 0)"
          echo "actions=${ACTIONS:-0}"            >> "$GITHUB_OUTPUT"
          echo "onsale=$(count_of onsale_soon)"   >> "$GITHUB_OUTPUT"
          echo "passed=$(count_of onsale_passed)" >> "$GITHUB_OUTPUT"
          echo "aging=$(count_of buy_aging)"      >> "$GITHUB_OUTPUT"

      - name: Mail the digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ACTIONS: ${{ steps.digest.outputs.actions }}
          ONSALE: ${{ steps.digest.outputs.onsale }}
          PASSED: ${{ steps.digest.outputs.passed }}
          AGING: ${{ steps.digest.outputs.aging }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/potentials_digest.txt ]; then
            echo "Nothing needs attention - no mail sent."
            exit 0
          fi
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "::warning::${ACTIONS:-0} item(s) need attention but RESEND_API_KEY is unset - digest not mailed."
            exit 0
          fi

          # The subject leads with whatever is most time-sensitive, so the inbox
          # row alone says whether this week can wait.
          if [ "${ONSALE:-0}" != "0" ]; then
            SUBJECT="[potentials] ${ONSALE} on-sale this week"
          elif [ "${AGING:-0}" != "0" ]; then
            SUBJECT="[potentials] ${AGING} Buy not purchased"
          elif [ "${PASSED:-0}" != "0" ]; then
            SUBJECT="[potentials] ${PASSED} on-sale passed, still open"
          else
            SUBJECT="[potentials] ${ACTIONS} to review"
          fi
          if [ "${ACTIONS:-0}" != "0" ]; then
            SUBJECT="$SUBJECT - ${ACTIONS} total"
          fi

          python3 scripts/notify_email.py \
            --subject "$SUBJECT" \
            --body-file /tmp/potentials_digest.txt
